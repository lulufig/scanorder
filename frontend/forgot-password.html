<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — ScanOrder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #FFF8ED;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      border-top: 5px solid #B91C1C;
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 36px rgba(33,19,15,0.14);
    }
    .brand {
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8A5A1F;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.4rem; color: #21130F; margin-bottom: .4rem; font-weight: 800; }
    .subtitle { color: #7A6654; font-size: .88rem; margin-bottom: 1.75rem; line-height: 1.5; }
    label { display: block; font-size: .8rem; font-weight: 700; color: #5F4B3B; margin-bottom: .3rem; letter-spacing: .04em; text-transform: uppercase; }
    input {
      width: 100%; padding: .7rem 1rem;
      border: 1.5px solid #D8C8B7;
      border-radius: 8px; font-size: .95rem; outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff; color: #21130F;
    }
    input:focus { border-color: #B91C1C; box-shadow: 0 0 0 3px rgba(185,28,28,.1); }
    .field { margin-bottom: 1.25rem; }
    .btn {
      width: 100%; padding: .85rem; background: #B91C1C; color: #fff;
      border: none; border-radius: 8px; font-size: .95rem; font-weight: 800;
      cursor: pointer; transition: background .2s;
    }
    .btn:hover:not(:disabled) { background: #991B1B; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .msg {
      padding: .65rem 1rem; border-radius: 8px;
      font-size: .875rem; margin-bottom: 1rem; display: none; line-height: 1.5;
    }
    .msg.visible { display: block; }
    .msg-error   { background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C; font-weight: 700; }
    .msg-success { background: #F0FDF4; border: 1px solid #BBF7D0; color: #15803D; }
    .back-link {
      display: block; text-align: center; margin-top: 1.25rem;
      font-size: .85rem; color: #7A6654; text-decoration: none;
    }
    .back-link:hover { color: #B91C1C; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Maven Burger</div>
    <h1>Recuperar contraseña</h1>
    <p class="subtitle">
      Ingresá tu email y te enviaremos un link para restablecer tu contraseña.
    </p>

    <div id="msg-error"   class="msg msg-error"></div>
    <div id="msg-success" class="msg msg-success"></div>

    <div id="form-section">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
      </div>
      <button class="btn" id="btn-enviar" onclick="enviarReset()">Enviar link de recuperación</button>
    </div>

    <a href="/frontend/login.html" class="back-link">← Volver al inicio de sesión</a>
  </div>

  <script src="/frontend/assets/js/config.js"></script>
  <script src="/frontend/assets/js/auth.js"></script>
  <script src="/frontend/assets/js/api.js"></script>
  <script>
    document.getElementById("email").addEventListener("keydown", e => {
      if (e.key === "Enter") enviarReset();
    });

    function showError(msg) {
      const el = document.getElementById("msg-error");
      el.textContent = msg;
      el.classList.add("visible");
      document.getElementById("msg-success").classList.remove("visible");
    }

    async function enviarReset() {
      const email = document.getElementById("email").value.trim();
      if (!email || !email.includes("@")) {
        showError("Ingresá un correo electrónico válido.");
        return;
      }

      const btn = document.getElementById("btn-enviar");
      btn.disabled = true;
      btn.textContent = "Enviando...";
      document.getElementById("msg-error").classList.remove("visible");

      try {
        await fetchAPI("/auth/forgot-password", "POST", { email }, false);

        // Siempre mostrar este mensaje (el backend no revela si el email existe)
        document.getElementById("form-section").style.display = "none";
        const el = document.getElementById("msg-success");
        el.innerHTML =
          "<strong>¡Listo!</strong> Si ese email está registrado, recibirás un mensaje " +
          "en los próximos minutos con el link para restablecer tu contraseña.<br><br>" +
          "<small>Revisá también la carpeta de spam.</small>";
        el.classList.add("visible");

      } catch (error) {
        if (error.status === 429) {
          showError("Demasiados intentos. Esperá 1 hora antes de intentar de nuevo.");
        } else {
          showError(error.message || "No se pudo procesar la solicitud. Intentá más tarde.");
        }
        btn.disabled = false;
        btn.textContent = "Enviar link de recuperación";
      }
    }
  </script>
</body>
</html>
