<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Maven Burger — Menú</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --red:    #C0392B;
      --red2:   #96281B;
      --beige:  #F5ECD7;
      --beige2: #EBD9BC;
      --dark:   #1A1009;
      --amber:  #E8A020;
      --cart-h: 0px; /* altura del carrito — se actualiza via JS */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--beige);
      color: var(--dark);
      min-height: 100vh;
      padding-bottom: 200px; /* espacio para el carrito fijo */
    }

    /* ===== HEADER ===== */
    .header {
      background: var(--dark);
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .header-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--beige);
      letter-spacing: -0.5px;
    }
    .header-logo span { color: var(--red); }

    .header-mesa {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(245,236,215,0.1);
      border: 1px solid rgba(245,236,215,0.15);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.8rem;
      color: rgba(245,236,215,0.8);
      font-weight: 600;
    }

    /* ===== HERO ===== */
    .hero {
      background: linear-gradient(135deg, var(--dark) 0%, #2d1a0e 100%);
      padding: 28px 20px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 70% 50%, rgba(192,57,43,0.25) 0%, transparent 65%);
    }
    .hero-tag {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 8px;
      position: relative;
    }
    .hero-title {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--beige);
      line-height: 1.1;
      position: relative;
    }
    .hero-title span { color: var(--red); }
    .hero-sub {
      font-size: 0.875rem;
      color: rgba(245,236,215,0.55);
      margin-top: 8px;
      position: relative;
    }

    /* ===== FILTROS POR CATEGORÍA ===== */
    .filtros-wrapper {
      background: white;
      border-bottom: 2px solid var(--beige2);
      position: sticky;
      top: 60px;
      z-index: 40;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filtros-wrapper::-webkit-scrollbar { display: none; }
    .filtros {
      display: flex;
      gap: 4px;
      padding: 10px 16px;
      min-width: max-content;
    }
    .filtro-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid rgba(26,16,9,0.1);
      background: transparent;
      color: #7a6a58;
      font-family: 'Nunito', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filtro-btn:hover { border-color: var(--red); color: var(--red); }
    .filtro-btn.active {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    /* ===== SECCIÓN DE PRODUCTOS ===== */
    .seccion {
      padding: 20px 16px 4px;
    }
    .seccion-titulo {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .seccion-titulo::after {
      content: '';
      flex: 1;
      height: 2px;
      background: var(--beige2);
      border-radius: 2px;
    }

    /* ===== CARDS DE PRODUCTOS ===== */
    .productos-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .producto-card {
      background: white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border: 1.5px solid rgba(26,16,9,0.06);
      box-shadow: 0 2px 8px rgba(26,16,9,0.05);
      transition: box-shadow 0.2s, transform 0.2s;
      animation: fadeUp 0.35s ease both;
    }
    .producto-card:active { transform: scale(0.98); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .producto-img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--beige2);
      flex-shrink: 0;
    }
    .producto-img-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      background: var(--beige2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
    }

    .producto-info { flex: 1; min-width: 0; }
    .producto-nombre {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--dark);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .producto-desc {
      font-size: 0.78rem;
      color: #a89880;
      line-height: 1.4;
      display: -webkit-box;
      /*-webkit-line-clamp: 2;*/
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .producto-precio {
      font-family: 'Syne', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--dark);
      margin-top: 6px;
    }

    /* ===== CONTROL DE CANTIDAD ===== */
    .cantidad-control {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
    }

    .btn-cantidad {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--red);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .btn-cantidad:hover  { background: var(--red2); }
    .btn-cantidad:active { transform: scale(0.9); }
    .btn-cantidad.minus  { background: #e8e0d4; color: var(--dark); }
    .btn-cantidad.minus:hover { background: var(--beige2); }

    .cantidad-num {
      width: 32px;
      text-align: center;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      color: var(--dark);
    }

    .badge-nodisponible {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #94a3b8;
    }

    /* ===== CARRITO FIJO ===== */
    .carrito-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: white;
      border-top: 2px solid var(--beige2);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    }
    .carrito-bar.visible { transform: translateY(0); }

    .carrito-resumen {
      padding: 14px 20px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .carrito-toggle-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .carrito-badge {
      width: 28px;
      height: 28px;
      background: var(--red);
      border-radius: 50%;
      color: white;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carrito-label {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--dark);
    }
    .carrito-total-mini {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      color: var(--dark);
    }

    /* Detalle expandible del carrito */
    .carrito-detalle {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .carrito-detalle.open { max-height: 300px; overflow-y: auto; }

    .carrito-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      border-top: 1px solid rgba(26,16,9,0.05);
    }
    .carrito-item-nombre { font-size: 0.875rem; font-weight: 600; }
    .carrito-item-detalle { font-size: 0.78rem; color: #a89880; }
    .carrito-item-sub {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.875rem;
    }

    .carrito-footer {
      padding: 12px 20px 20px;
      border-top: 1px solid var(--beige2);
    }

    .btn-confirmar {
      width: 100%;
      padding: 15px;
      background: var(--red);
      color: white;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(192,57,43,0.4);
      transition: background 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-confirmar:hover  { background: var(--red2); }
    .btn-confirmar:active { transform: scale(0.98); }
    .btn-confirmar:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ===== PANTALLA DE ÉXITO ===== */
    .exito-overlay {
      position: fixed;
      inset: 0;
      background: var(--beige);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .exito-overlay.visible { opacity: 1; pointer-events: all; }

    .exito-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: bounce 0.6s cubic-bezier(0.36,0.07,0.19,0.97) both;
    }
    @keyframes bounce {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .exito-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 10px;
    }
    .exito-msg {
      font-size: 0.95rem;
      color: #7a6a58;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-volver {
      padding: 14px 32px;
      background: var(--dark);
      color: var(--beige);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-volver:hover { background: #2d1a0e; }

    /* ===== EMPTY / LOADING ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #a89880;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }

    /* ===== SPINNER ===== */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-logo">Maven<span>Burger</span></div>
    <div class="header-mesa" id="header-mesa"> Mesa —</div>
  </header>

  <!-- ===== HERO ===== -->
  <div class="hero">
    <div class="hero-tag">Maven Burger — Pedí desde tu mesa</div>
    <h1 class="hero-title">Nuestro <span>Menú</span></h1>
    <p class="hero-sub" id="hero-sub">Elegí lo que querés y confirmá tu pedido</p>
  </div>

  <!-- ===== FILTROS ===== -->
  <div class="filtros-wrapper">
    <div class="filtros" id="filtros-container">
      <button class="filtro-btn active" onclick="filtrarCategoria('todos', this)">🍽 Todos</button>
    </div>
  </div>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <div id="menu-container">
    <div class="empty-state" style="padding-top: 80px;">
      <div class="icon">⏳</div>
      <p>Cargando el menú...</p>
    </div>
  </div>

  <!-- ===== CARRITO ===== -->
  <div class="carrito-bar" id="carrito-bar">
    <div class="carrito-resumen" onclick="toggleCarrito()">
      <div class="carrito-toggle-info">
        <div class="carrito-badge" id="carrito-badge">0</div>
        <div>
          <div class="carrito-label">Tu pedido</div>
          <div style="font-size:0.75rem; color:#a89880;" id="carrito-items-label">0 productos</div>
        </div>
      </div>
      <div class="carrito-total-mini" id="carrito-total-mini">$0.00</div>
    </div>

    <div class="carrito-detalle" id="carrito-detalle">
      <div id="carrito-items-lista"></div>
    </div>

    <div class="carrito-footer">
      <button class="btn-confirmar" id="btn-confirmar" onclick="confirmarPedido()">
         Confirmar pedido
      </button>
    </div>
  </div>

  <!-- ===== PANTALLA DE ÉXITO ===== -->
  <div class="exito-overlay" id="exito-overlay">
    <div class="exito-icon">✅</div>
    <h2 class="exito-title">¡Pedido enviado!</h2>
    <p class="exito-msg" id="exito-msg">
      Tu pedido fue enviado a cocina.<br>
      En breve estará listo.
    </p>
    <button class="btn-volver" onclick="volverAlMenu()">Hacer otro pedido</button>
  </div>

  <!-- Scripts — config, auth y api en orden -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>

  <script>
    // ── ESTA PÁGINA ES PÚBLICA — no requiere login ──────────────
    // El cliente escanea el QR y entra directo, sin autenticarse

    // ── LEER MESA DESDE LA URL ──────────────────────────────────
    // El QR apunta a: /cliente/menu.html?mesa=3
    const params = new URLSearchParams(window.location.search);
    const mesaId = params.get("mesa");

    if (!mesaId) {
      document.getElementById("hero-sub").textContent =
        "⚠ No se detectó número de mesa. Escaneá el QR de tu mesa.";
    } else {
      document.getElementById("header-mesa").textContent = `🪑 Mesa ${mesaId}`;
      document.getElementById("hero-sub").textContent    =
        `Mesa ${mesaId} — Elegí lo que querés y confirmá tu pedido`;
    }

    // ── ESTADO DEL CARRITO ──────────────────────────────────────
    // Estructura: [{ id_producto, nombre, precio, cantidad }]
    let carrito        = [];
    let todosProductos = [];
    let carritoAbierto = false;

    // ── CARGAR MENÚ ─────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", cargarMenu);

    async function cargarMenu() {
      try {
        // GET /productos — ruta pública (auth=false)
        // El cliente no tiene token JWT
        const data = await fetchAPI("/productos", "GET", null, false);
        todosProductos = Array.isArray(data) ? data.filter(p => p.disponible) : [];

        if (todosProductos.length === 0) {
          document.getElementById("menu-container").innerHTML = `
            <div class="empty-state" style="padding-top:80px;">
              <div class="icon">🍔</div>
              <p>El menú no está disponible por el momento.</p>
            </div>`;
          return;
        }

        construirFiltros(todosProductos);
        renderMenu(todosProductos);

      } catch (error) {
        document.getElementById("menu-container").innerHTML = `
          <div class="empty-state" style="padding-top:80px;">
            <div class="icon">⚠️</div>
            <p>No se pudo cargar el menú.<br>
               <small style="color:#c4b49a;">${escapeHtml(error.message)}</small>
            </p>
          </div>`;
      }
    }

    // ── FILTROS POR CATEGORÍA ────────────────────────────────────
    function construirFiltros(productos) {
      const categorias = [...new Set(productos.map(p => p.categoria).filter(Boolean))];
      const iconos = {
        hamburguesas: "🍔",
        papas:        "🍟",
        bebidas:      "🥤",
        postres:      "🍨",
        combos:       "📦",
        otros:        "🍽",
      };

      const container = document.getElementById("filtros-container");
      categorias.forEach(cat => {
        const btn = document.createElement("button");
        btn.className   = "filtro-btn";
        btn.textContent = `${iconos[cat] || "🍽"} ${capitalize(cat)}`;
        btn.onclick     = () => filtrarCategoria(cat, btn);
        container.appendChild(btn);
      });
    }

    function filtrarCategoria(categoria, btnEl) {
      document.querySelectorAll(".filtro-btn").forEach(b => b.classList.remove("active"));
      btnEl.classList.add("active");

      const filtrados = categoria === "todos"
        ? todosProductos
        : todosProductos.filter(p => p.categoria === categoria);

      renderMenu(filtrados);
    }

    // ── RENDER DEL MENÚ ──────────────────────────────────────────
    function renderMenu(productos) {
      const container = document.getElementById("menu-container");

      if (productos.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding-top:60px;">
            <div class="icon">🔍</div>
            <p>No hay productos en esta categoría.</p>
          </div>`;
        return;
      }

      // Agrupar por categoría
      const grupos = {};
      productos.forEach(p => {
        const cat = p.categoria || "otros";
        if (!grupos[cat]) grupos[cat] = [];
        grupos[cat].push(p);
      });

      const iconos = {
        hamburguesas: "🍔", papas: "🍟", bebidas: "🥤",
        postres: "🍨", combos: "📦", otros: "🍽",
      };

      let html = "";
      Object.entries(grupos).forEach(([cat, items]) => {
        html += `
          <div class="seccion">
            <div class="seccion-titulo">${iconos[cat] || "🍽"} ${capitalize(cat)}</div>
            <div class="productos-grid">
              ${items.map((p, i) => renderProductoCard(p, i)).join("")}
            </div>
          </div>`;
      });

      container.innerHTML = html;
    }

    function renderProductoCard(p, i) {
      const enCarrito = carrito.find(c => c.id_producto === p.id_producto);
      const cantidad  = enCarrito ? enCarrito.cantidad : 0;

      return `
        <div class="producto-card" style="animation-delay:${i * 0.04}s" id="card-${p.id_producto}">
          ${p.imagen_url
            ? `<img src="${escapeHtml(p.imagen_url)}" class="producto-img"
                    alt="${escapeHtml(p.nombre)}"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">`
            : ""
          }
          <div class="producto-img-placeholder" ${p.imagen_url ? 'style="display:none"' : ""}>🍔</div>

          <div class="producto-info">
            <div class="producto-nombre">${escapeHtml(p.nombre)}</div>
            ${p.descripcion
              ? `<div class="producto-desc">${escapeHtml(p.descripcion)}</div>`
              : ""
            }
            <div class="producto-precio">$${Number(p.precio).toFixed(2)}</div>
          </div>

          <div class="cantidad-control" id="ctrl-${p.id_producto}">
            ${cantidad === 0
              ? `<button class="btn-cantidad" onclick="agregarAlCarrito(${p.id_producto})">+</button>`
              : `<button class="btn-cantidad minus" onclick="quitarDelCarrito(${p.id_producto})">−</button>
                 <span class="cantidad-num">${cantidad}</span>
                 <button class="btn-cantidad" onclick="agregarAlCarrito(${p.id_producto})">+</button>`
            }
          </div>
        </div>`;
    }

    // ── CARRITO: AGREGAR ─────────────────────────────────────────
    function agregarAlCarrito(idProducto) {
      const producto = todosProductos.find(p => p.id_producto === idProducto);
      if (!producto) return;

      const existente = carrito.find(c => c.id_producto === idProducto);
      if (existente) {
        existente.cantidad++;
      } else {
        carrito.push({
          id_producto: producto.id_producto,
          nombre:      producto.nombre,
          precio:      producto.precio,
          cantidad:    1
        });
      }

      actualizarControlCantidad(idProducto);
      actualizarCarritoUI();
    }

    // ── CARRITO: QUITAR ──────────────────────────────────────────
    function quitarDelCarrito(idProducto) {
      const existente = carrito.find(c => c.id_producto === idProducto);
      if (!existente) return;

      existente.cantidad--;
      if (existente.cantidad <= 0) {
        carrito = carrito.filter(c => c.id_producto !== idProducto);
      }

      actualizarControlCantidad(idProducto);
      actualizarCarritoUI();
    }

    // ── ACTUALIZAR BOTONES DE CANTIDAD EN LA CARD ────────────────
    function actualizarControlCantidad(idProducto) {
      const ctrl    = document.getElementById(`ctrl-${idProducto}`);
      if (!ctrl) return;

      const item    = carrito.find(c => c.id_producto === idProducto);
      const cantidad = item ? item.cantidad : 0;

      ctrl.innerHTML = cantidad === 0
        ? `<button class="btn-cantidad" onclick="agregarAlCarrito(${idProducto})">+</button>`
        : `<button class="btn-cantidad minus" onclick="quitarDelCarrito(${idProducto})">−</button>
           <span class="cantidad-num">${cantidad}</span>
           <button class="btn-cantidad" onclick="agregarAlCarrito(${idProducto})">+</button>`;
    }

    // ── ACTUALIZAR UI DEL CARRITO ────────────────────────────────
    function actualizarCarritoUI() {
      const total    = carrito.reduce((acc, c) => acc + c.precio * c.cantidad, 0);
      const cantidad = carrito.reduce((acc, c) => acc + c.cantidad, 0);
      const bar      = document.getElementById("carrito-bar");

      // Mostrar u ocultar la barra
      if (cantidad > 0) {
        bar.classList.add("visible");
      } else {
        bar.classList.remove("visible");
        carritoAbierto = false;
        document.getElementById("carrito-detalle").classList.remove("open");
      }

      document.getElementById("carrito-badge").textContent     = cantidad;
      document.getElementById("carrito-total-mini").textContent = `$${total.toFixed(2)}`;
      document.getElementById("carrito-items-label").textContent =
        cantidad === 1 ? "1 producto" : `${cantidad} productos`;

      // Renderizar lista del detalle
      const lista = document.getElementById("carrito-items-lista");
      lista.innerHTML = carrito.map(item => `
        <div class="carrito-item">
          <div>
            <div class="carrito-item-nombre">${escapeHtml(item.nombre)}</div>
            <div class="carrito-item-detalle">
              ${item.cantidad} × $${Number(item.precio).toFixed(2)}
            </div>
          </div>
          <div class="carrito-item-sub">$${(item.precio * item.cantidad).toFixed(2)}</div>
        </div>
      `).join("");
    }

    // ── TOGGLE DEL CARRITO ───────────────────────────────────────
    function toggleCarrito() {
      carritoAbierto = !carritoAbierto;
      document.getElementById("carrito-detalle").classList.toggle("open", carritoAbierto);
    }

    // ── CONFIRMAR PEDIDO ─────────────────────────────────────────
    async function confirmarPedido() {
      if (carrito.length === 0) return;

      if (!mesaId) {
        alert("No se detectó el número de mesa. Escaneá el QR de tu mesa.");
        return;
      }

      const btn = document.getElementById("btn-confirmar");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Enviando pedido...';

      // Body que espera el backend:
      // { id_mesa: int, productos: [{ id_producto, cantidad }] }
      const body = {
        id_mesa: parseInt(mesaId),
        productos: carrito.map(c => ({
          id_producto: c.id_producto,
          cantidad:    c.cantidad
        }))
      };

      try {
        // POST /pedidos — sin token (cliente no tiene cuenta)
        await fetchAPI("/pedidos", "POST", body, false);
        mostrarExito();
      } catch (error) {
        alert("No se pudo enviar el pedido: " + error.message);
        btn.disabled = false;
        btn.innerHTML = " Confirmar pedido";
      }
    }

    // ── PANTALLA DE ÉXITO ────────────────────────────────────────
    function mostrarExito() {
      document.getElementById("exito-msg").innerHTML =
        `Tu pedido fue enviado a cocina.<br>
         <strong>Mesa ${mesaId}</strong> — En breve estará listo. `;
      document.getElementById("exito-overlay").classList.add("visible");
    }

    // ── VOLVER AL MENÚ DESPUÉS DEL PEDIDO ───────────────────────
    function volverAlMenu() {
      // Limpiar carrito
      carrito = [];
      actualizarCarritoUI();

      // Ocultar pantalla de éxito
      document.getElementById("exito-overlay").classList.remove("visible");

      // Resetear botón
      const btn = document.getElementById("btn-confirmar");
      btn.disabled = false;
      btn.innerHTML = " Confirmar pedido";

      // Volver al inicio de la página
      window.scrollTo({ top: 0, behavior: "smooth" });

      // Resetear cards de cantidad
      todosProductos.forEach(p => actualizarControlCantidad(p.id_producto));
    }

    // ── HELPERS ──────────────────────────────────────────────────
    function capitalize(str) {
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
