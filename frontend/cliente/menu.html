<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Maven Burger — Menú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./menu.css" />
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-logo">Maven<span>Burger</span></div>
    <div class="header-mesa" id="header-mesa">🪑 Mesa —</div>
  </header>

  <!-- ===== HERO ===== -->
  <div class="hero">
    <div class="hero-tag">Pedí desde tu mesa</div>
    <h1 class="hero-title">Maven <span>Burger</span></h1>
    <p class="hero-sub" id="hero-sub">Elegí lo que querés y confirmá tu pedido</p>
  </div>

  <!-- ===== BUSCADOR ===== -->
  <div class="menu-tools">
    <label class="buscador" for="buscador-productos">
      <span class="buscador-icon">🔎</span>
      <input
        id="buscador-productos"
        type="search"
        placeholder="Buscar burger, papas, bebida..."
        autocomplete="off"
      />
    </label>
  </div>

  <!-- ===== FILTROS ===== -->
  <div class="filtros-wrapper">
    <div class="filtros" id="filtros-container">
      <button class="filtro-btn active" onclick="filtrarCategoria('todos', this)">🍽 Todos</button>
    </div>
  </div>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <div id="menu-container">
    <div class="empty-state" style="padding-top: 80px;">
      <div class="icon">⏳</div>
      <p>Cargando el menú...</p>
    </div>
  </div>

  <!-- ===== CARRITO ===== -->
  <div class="carrito-bar" id="carrito-bar">
    <div class="carrito-resumen" onclick="toggleCarrito()">
      <div class="carrito-toggle-info">
        <div class="carrito-badge" id="carrito-badge">0</div>
        <div>
          <div class="carrito-label">Tu pedido</div>
          <div style="font-size:0.75rem; color:rgba(255,240,208,0.72);" id="carrito-items-label">0 productos</div>
        </div>
      </div>
      <div class="carrito-total-mini" id="carrito-total-mini">$0.00</div>
    </div>

    <div class="carrito-detalle" id="carrito-detalle">
      <div id="carrito-items-lista"></div>
    </div>

    <div class="carrito-footer">
      <div class="observaciones-box">
        <label for="pedido-observaciones">Observaciones del pedido</label>
        <textarea
          id="pedido-observaciones"
          maxlength="300"
          placeholder="Ej: sin cebolla, sin sal, bebida sin hielo..."
        ></textarea>
      </div>

      <div class="carrito-actions">
        <button class="btn-vaciar" type="button" onclick="vaciarCarrito()">Vaciar</button>
        <button class="btn-confirmar" id="btn-confirmar" onclick="confirmarPedido()">
          🛒 Confirmar pedido
        </button>
      </div>
    </div>
  </div>

  <!-- ===== CONFIRMACIÓN ===== -->
  <div class="confirmacion-overlay" id="confirmacion-overlay">
    <div class="confirmacion-modal">
      <h2 class="confirmacion-title">Confirmar pedido</h2>
      <p id="confirmacion-mesa">Mesa —</p>
      <div class="confirmacion-lista" id="confirmacion-lista"></div>
      <div class="confirmacion-notas" id="confirmacion-notas" style="display:none;"></div>
      <div class="confirmacion-total">
        <span>Total</span>
        <span id="confirmacion-total">$0</span>
      </div>
      <div class="confirmacion-actions">
        <button class="btn-secundario" type="button" onclick="cerrarConfirmacion()">Revisar</button>
        <button class="btn-enviar-final" id="btn-enviar-final" type="button" onclick="enviarPedidoConfirmado()">Enviar a cocina</button>
      </div>
    </div>
  </div>

  <!-- ===== PANTALLA DE ÉXITO ===== -->
  <div class="exito-overlay" id="exito-overlay">
    <div class="exito-icon">✅</div>
    <h2 class="exito-title">¡Pedido enviado!</h2>
    <p class="exito-msg" id="exito-msg">
      Tu pedido fue enviado a cocina.<br>
      En breve estará listo.
    </p>
    <button class="btn-volver" onclick="volverAlMenu()">Hacer otro pedido</button>
  </div>

  <!-- Scripts — config y api en orden. Esta página pública no requiere auth.js. -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>

  <script src="./menu.js"></script>
</body>
</html>
