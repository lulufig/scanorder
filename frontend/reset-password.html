<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña — ScanOrder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #FFF8ED;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      border-top: 5px solid #B91C1C;
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 36px rgba(33,19,15,0.14);
    }
    .brand {
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8A5A1F;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.4rem; color: #21130F; margin-bottom: .4rem; font-weight: 800; }
    .subtitle { color: #7A6654; font-size: .88rem; margin-bottom: 1.75rem; line-height: 1.5; }
    label { display: block; font-size: .8rem; font-weight: 700; color: #5F4B3B; margin-bottom: .3rem; letter-spacing: .04em; text-transform: uppercase; }
    input {
      width: 100%; padding: .7rem 1rem;
      border: 1.5px solid #D8C8B7;
      border-radius: 8px; font-size: .95rem; outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff; color: #21130F;
    }
    input:focus { border-color: #B91C1C; box-shadow: 0 0 0 3px rgba(185,28,28,.1); }
    .field { margin-bottom: 1rem; }
    .btn {
      width: 100%; padding: .85rem; background: #B91C1C; color: #fff;
      border: none; border-radius: 8px; font-size: .95rem; font-weight: 800;
      cursor: pointer; transition: background .2s; margin-top: .5rem;
    }
    .btn:hover:not(:disabled) { background: #991B1B; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .msg {
      padding: .65rem 1rem; border-radius: 8px;
      font-size: .875rem; margin-bottom: 1rem; display: none; line-height: 1.5;
    }
    .msg.visible { display: block; }
    .msg-error   { background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C; font-weight: 700; }
    .msg-success { background: #F0FDF4; border: 1px solid #BBF7D0; color: #15803D; font-weight: 700; }
    .back-link {
      display: block; text-align: center; margin-top: 1.25rem;
      font-size: .85rem; color: #7A6654; text-decoration: none;
    }
    .back-link:hover { color: #B91C1C; }
    /* Token inválido */
    .token-error {
      text-align: center; padding: 1.5rem 0;
    }
    .token-error p { color: #7A6654; font-size: .9rem; margin-top: .5rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Maven Burger</div>
    <h1>Nueva contraseña</h1>
    <p class="subtitle">Elegí una contraseña segura para tu cuenta.</p>

    <div id="msg-error"   class="msg msg-error"></div>
    <div id="msg-success" class="msg msg-success"></div>

    <!-- Token inválido / ausente -->
    <div id="token-error-section" class="token-error" style="display:none;">
      <strong style="color:#B91C1C;">Link inválido o expirado</strong>
      <p>Este link ya fue utilizado o expiró (duran 30 minutos).<br>
         Solicitá uno nuevo desde la pantalla de recuperación.</p>
      <a href="/frontend/forgot-password.html" class="btn" style="display:inline-block;margin-top:1rem;text-decoration:none;text-align:center;">
        Solicitar nuevo link
      </a>
    </div>

    <!-- Formulario -->
    <div id="form-section">
      <div class="field">
        <label for="nueva">Nueva contraseña</label>
        <input type="password" id="nueva" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" placeholder="Repetí la contraseña" autocomplete="new-password">
      </div>
      <button class="btn" id="btn-guardar" onclick="resetPassword()">Guardar nueva contraseña</button>
    </div>

    <a href="/frontend/login.html" class="back-link" id="back-login">← Volver al inicio de sesión</a>
  </div>

  <script src="/frontend/assets/js/config.js"></script>
  <script src="/frontend/assets/js/auth.js"></script>
  <script src="/frontend/assets/js/api.js"></script>
  <script>
    // Leer token de la URL (?token=...)
    const _params = new URLSearchParams(window.location.search);
    const _token  = _params.get("token");

    if (!_token) {
      document.getElementById("form-section").style.display = "none";
      document.getElementById("token-error-section").style.display = "block";
    }

    document.getElementById("confirmar").addEventListener("keydown", e => {
      if (e.key === "Enter") resetPassword();
    });

    function showError(msg) {
      const el = document.getElementById("msg-error");
      el.textContent = msg;
      el.classList.add("visible");
      document.getElementById("msg-success").classList.remove("visible");
    }

    async function resetPassword() {
      const nueva     = document.getElementById("nueva").value;
      const confirmar = document.getElementById("confirmar").value;

      if (!nueva || !confirmar) { showError("Completá ambos campos."); return; }
      if (nueva.length < 8)    { showError("La contraseña debe tener al menos 8 caracteres."); return; }
      if (nueva !== confirmar) { showError("Las contraseñas no coinciden."); return; }

      const btn = document.getElementById("btn-guardar");
      btn.disabled = true;
      btn.textContent = "Guardando...";
      document.getElementById("msg-error").classList.remove("visible");

      try {
        await fetchAPI("/auth/reset-password", "POST", {
          token: _token,
          nueva_password: nueva,
        }, false);

        document.getElementById("form-section").style.display = "none";
        document.getElementById("back-login").style.display   = "none";
        const el = document.getElementById("msg-success");
        el.textContent = "¡Contraseña actualizada! Redirigiendo al login...";
        el.classList.add("visible");

        setTimeout(() => { window.location.href = "/frontend/login.html"; }, 2000);

      } catch (error) {
        // Token expirado o ya usado
        if (error.status === 400) {
          document.getElementById("form-section").style.display = "none";
          document.getElementById("token-error-section").style.display = "block";
        } else {
          showError(error.message || "No se pudo actualizar la contraseña. Intentá de nuevo.");
          btn.disabled = false;
          btn.textContent = "Guardar nueva contraseña";
        }
      }
    }
  </script>
</body>
</html>
