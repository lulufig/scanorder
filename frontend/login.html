<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Iniciar sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="auth/css/login.css" />
</head>

<body>
  <!-- Fondo decorativo -->
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="bg-circle bg-circle-3"></div>

  <!-- Card de login -->
  <div class="login-card" id="login-card">

    <!-- Logo -->
    <div>
      <div class="logo">Scan<span>Order</span></div>
      <div class="logo-tag">Maven Burger — Panel de gestión</div>
    </div>

    <div class="divider"></div>

    <!-- Formulario -->
    <div style="display: flex; flex-direction: column; gap: 20px;">

      <!-- Email -->
      <div>
        <label class="field-label" for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          class="field-input"
          placeholder="usuario@mavenburger.com"
          autocomplete="email"
        />
      </div>

      <!-- Contraseña -->
      <div>
        <label class="field-label" for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          class="field-input"
          placeholder="********"
          autocomplete="current-password"
        />
      </div>

      <!-- Error -->
      <div class="error-box" id="error-box">
        <span>!</span>
        <span id="error-msg">Credenciales inválidas</span>
      </div>

      <!-- Botón -->
      <button class="btn-login" id="btn-login" onclick="handleLogin()">
        Iniciar sesión
      </button>

      <!-- Forgot password -->
      <p style="text-align:center; margin-top: 4px;">
        <a href="/frontend/forgot-password.html"
           style="font-size:0.82rem; color:#7A6654; text-decoration:none; transition:color .2s;"
           onmouseover="this.style.color='#B91C1C'" onmouseout="this.style.color='#7A6654'">
          ¿Olvidaste tu contraseña?
        </a>
      </p>

    </div>

    <!-- Footer -->
    <p class="footer-text">
      Solo para personal autorizado de Maven Burger
    </p>

  </div>

  <!-- Scripts base — orden obligatorio -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>

    <script src="auth/js/login.js"></script>
</body>
</html>
