<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Iniciar sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --red:    #C0392B;
      --red2:   #96281B;
      --beige:  #F5ECD7;
      --beige2: #EBD9BC;
      --dark:   #1A1009;
      --amber:  #E8A020;
      --gray:   #7a6a58;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ---- Fondo animado con círculos ---- */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .bg-circle-1 {
      width: 500px; height: 500px;
      background: var(--red);
      top: -100px; left: -100px;
      animation-delay: 0s;
    }
    .bg-circle-2 {
      width: 400px; height: 400px;
      background: var(--amber);
      bottom: -80px; right: -80px;
      animation-delay: -5s;
    }
    .bg-circle-3 {
      width: 300px; height: 300px;
      background: var(--red2);
      bottom: 100px; left: 30%;
      animation-delay: -3s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    /* ---- Card principal ---- */
    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(245, 236, 215, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(245, 236, 215, 0.12);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- Logotipo ---- */
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--beige);
      letter-spacing: -1px;
      line-height: 1;
    }
    .logo span { color: var(--red); }

    .logo-tag {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      margin-top: 4px;
    }

    /* ---- Separador ---- */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(245,236,215,0.15), transparent);
      margin: 28px 0;
    }

    /* ---- Labels e inputs ---- */
    .field-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(245, 236, 215, 0.5);
      margin-bottom: 8px;
    }

    .field-input {
      width: 100%;
      background: rgba(245, 236, 215, 0.06);
      border: 1px solid rgba(245, 236, 215, 0.14);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--beige);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .field-input::placeholder { color: rgba(245,236,215,0.25); }
    .field-input:focus {
      border-color: var(--amber);
      background: rgba(245, 236, 215, 0.09);
    }

    /* ---- Botón principal ---- */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--red);
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(192, 57, 43, 0.4);
      position: relative;
      overflow: hidden;
    }
    .btn-login:hover {
      background: var(--red2);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(192, 57, 43, 0.55);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ---- Spinner dentro del botón ---- */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Mensaje de error ---- */
    .error-box {
      background: rgba(192, 57, 43, 0.15);
      border: 1px solid rgba(192, 57, 43, 0.4);
      border-radius: 10px;
      padding: 12px 16px;
      color: #f4a49e;
      font-size: 0.875rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .error-box.visible { display: flex; align-items: center; gap: 8px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

    /* ---- Shake en error ---- */
    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    /* ---- Footer ---- */
    .footer-text {
      font-size: 0.78rem;
      color: rgba(245, 236, 215, 0.25);
      text-align: center;
      margin-top: 28px;
    }
  

    /* ===== AJUSTE PROFESIONAL LOGIN ===== */
    :root {
      --red: #B91C1C;
      --red2: #991B1B;
      --beige: #F9FAFB;
      --beige2: #E5E7EB;
      --dark: #111827;
      --amber: #B45309;
      --gray: #6B7280;
      --line: #E5E7EB;
      --surface: #FFFFFF;
      --surface-soft: #F9FAFB;
    }

    body {
      background: #F3F4F6;
      color: #111827;
      overflow: auto;
      padding: 24px;
      font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0 auto 0 0;
      width: min(42vw, 520px);
      background: #111827;
      z-index: 0;
    }

    .bg-circle { display: none; }

    .login-card {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(260px, 38%) 1fr;
      gap: 0;
      max-width: 960px;
      width: min(100%, 960px);
      min-height: 560px;
      padding: 0;
      overflow: hidden;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(17,24,39,0.12);
      backdrop-filter: none;
      animation: loginFade 0.35s ease both;
    }

    .login-card::before {
      content: 'Sistema ScanOrder';
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 32px;
      background: #111827;
      color: #CBD5E1;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      grid-row: 1 / span 4;
      grid-column: 1;
      min-height: 560px;
    }

    @keyframes loginFade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card > div:not(.divider),
    .login-card > p {
      grid-column: 2;
    }

    .login-card > div:first-of-type {
      padding: 48px 48px 0;
    }

    .login-card > div[style] {
      padding: 0 48px;
    }

    .footer-text {
      padding: 0 48px 42px;
      margin-top: 24px;
      color: #6B7280;
      text-align: left;
    }

    .logo {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #111827;
      letter-spacing: 0;
    }
    .logo span { color: #B91C1C; }
    .logo-tag {
      color: #6B7280;
      letter-spacing: 0.08em;
      font-weight: 800;
      margin-top: 8px;
    }

    .divider {
      grid-column: 2;
      height: 1px;
      background: #E5E7EB;
      margin: 32px 48px;
    }

    .field-label {
      color: #374151;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .field-input {
      background: #FFFFFF;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      color: #111827;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .field-input::placeholder { color: #9CA3AF; }
    .field-input:focus {
      border-color: #B91C1C;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(185,28,28,0.10);
    }

    .btn-login {
      background: #B91C1C;
      border-radius: 8px;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: none;
    }
    .btn-login:hover {
      background: #991B1B;
      box-shadow: none;
    }

    .error-box {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      color: #B91C1C;
      font-weight: 700;
    }
    .error-box span:first-child {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: #FEE2E2;
      color: #B91C1C;
      font-weight: 900;
      flex-shrink: 0;
    }

    .spinner { margin-right: 8px; }

    @media (max-width: 760px) {
      body { padding: 16px; align-items: flex-start; }
      body::before { display: none; }
      .login-card {
        display: block;
        min-height: auto;
        max-width: 440px;
        margin-top: 24px;
      }
      .login-card::before { display: none; }
      .login-card > div:first-of-type { padding: 34px 28px 0; }
      .login-card > div[style] { padding: 0 28px; }
      .divider { margin: 28px; }
      .footer-text { padding: 0 28px 30px; text-align: center; }
      .logo { font-size: 1.75rem; }
    }

    /* ===== LOGIN MAVEN V2 ===== */
    body {
      background:
        radial-gradient(circle at 18% 18%, rgba(185,28,28,0.16) 0, rgba(185,28,28,0.00) 28%),
        radial-gradient(circle at 82% 78%, rgba(180,83,9,0.18) 0, rgba(180,83,9,0.00) 30%),
        linear-gradient(135deg, #FFF8ED 0%, #F3E4CF 48%, #E9D5BC 100%);
      align-items: center;
      overflow: auto;
    }

    body::before {
      display: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(33,19,15,0.08) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, rgba(33,19,15,0.06) 0 1px, transparent 1px 100%);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent 72%);
      z-index: 0;
    }

    .login-card {
      display: block;
      width: min(100%, 430px);
      max-width: 430px;
      min-height: auto;
      padding: 0;
      background: #FFFDF8;
      border: 1px solid rgba(33,19,15,0.10);
      border-top: 5px solid #B91C1C;
      border-radius: 10px;
      box-shadow: 0 18px 42px rgba(33,19,15,0.16);
    }

    .login-card::before {
      content: 'Maven Burger';
      display: block;
      min-height: auto;
      padding: 26px 34px 0;
      background: transparent;
      color: #8A5A1F;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .login-card > div:not(.divider),
    .login-card > p {
      grid-column: auto;
    }

    .login-card > div:first-of-type {
      padding: 8px 34px 0;
    }

    .login-card > div[style] {
      padding: 0 34px;
    }

    .logo {
      color: #21130F;
      font-size: 2.15rem;
      line-height: 1;
    }

    .logo span {
      color: #B91C1C;
    }

    .logo-tag {
      color: #7A6654;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
    }

    .divider {
      grid-column: auto;
      margin: 28px 34px;
      background: rgba(33,19,15,0.10);
    }

    .field-label {
      color: #5F4B3B;
    }

    .field-input {
      background: #FFFFFF;
      border-color: #D8C8B7;
      color: #21130F;
    }

    .field-input:focus {
      border-color: #B91C1C;
      box-shadow: 0 0 0 3px rgba(185,28,28,0.12);
    }

    .btn-login {
      background: #B91C1C;
      border-radius: 8px;
    }

    .btn-login:hover {
      background: #991B1B;
    }

    .footer-text {
      padding: 0 34px 32px;
      color: #7A6654;
      text-align: center;
    }

    @media (max-width: 760px) {
      body {
        align-items: center;
        padding: 18px;
      }

      .login-card {
        margin-top: 0;
      }

      .login-card::before {
        display: block;
        padding: 24px 28px 0;
      }

      .login-card > div:first-of-type {
        padding: 8px 28px 0;
      }

      .login-card > div[style] {
        padding: 0 28px;
      }

      .divider {
        margin: 26px 28px;
      }

      .footer-text {
        padding: 0 28px 30px;
      }
    }

  </style>
</head>

<body>
  <!-- Fondo decorativo -->
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="bg-circle bg-circle-3"></div>

  <!-- Card de login -->
  <div class="login-card" id="login-card">

    <!-- Logo -->
    <div>
      <div class="logo">Scan<span>Order</span></div>
      <div class="logo-tag">Maven Burger — Panel de gestión</div>
    </div>

    <div class="divider"></div>

    <!-- Formulario -->
    <div style="display: flex; flex-direction: column; gap: 20px;">

      <!-- Email -->
      <div>
        <label class="field-label" for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          class="field-input"
          placeholder="usuario@mavenburger.com"
          autocomplete="email"
        />
      </div>

      <!-- Contraseña -->
      <div>
        <label class="field-label" for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          class="field-input"
          placeholder="********"
          autocomplete="current-password"
        />
      </div>

      <!-- Error -->
      <div class="error-box" id="error-box">
        <span>!</span>
        <span id="error-msg">Credenciales inválidas</span>
      </div>

      <!-- Botón -->
      <button class="btn-login" id="btn-login" onclick="handleLogin()">
        Iniciar sesión
      </button>

    </div>

    <!-- Footer -->
    <p class="footer-text">
      Solo para personal autorizado de Maven Burger
    </p>

  </div>

  <!-- Scripts base — orden obligatorio -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>

  <script>
    // Si ya hay sesión activa, redirigir directo al panel correspondiente
    if (isLoggedIn()) {
      const role = getUserRole();
      if (role === ROLES.ADMIN)  window.location.href = ROUTES.admin;
      if (role === ROLES.COCINA) window.location.href = ROUTES.cocina;
    }

    // Permitir enviar con Enter desde cualquier campo
    document.getElementById("email").addEventListener("keydown",    e => { if (e.key === "Enter") handleLogin(); });
    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });

    function showError(msg) {
      const box = document.getElementById("error-box");
      document.getElementById("error-msg").textContent = msg;
      box.classList.add("visible");

      // Efecto shake en la card
      const card = document.getElementById("login-card");
      card.classList.remove("shake");
      void card.offsetWidth; // reflow para reiniciar animación
      card.classList.add("shake");
    }

    function hideError() {
      document.getElementById("error-box").classList.remove("visible");
    }

    function setLoading(loading) {
      const btn = document.getElementById("btn-login");
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Verificando...';
      } else {
        btn.disabled = false;
        btn.innerHTML = 'Iniciar sesión';
      }
    }

    async function handleLogin() {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      hideError();

      // Validación básica en el cliente
      if (!email || !password) {
        showError("Completá los dos campos para continuar.");
        return;
      }
      if (!email.includes("@")) {
        showError("Ingresá un correo electrónico válido.");
        return;
      }

      setLoading(true);

      try {
        // POST /auth/login — sin token (auth=false)
        // El backend espera: { email, password }
        // Responde con: { access_token, token_type, user: { id_usuario, nombre, email, rol, activo } }
        const data = await fetchAPI("/auth/login", "POST", { email, password }, false);

        // Guardar token y datos del usuario
        saveToken(data.access_token);
        saveUser(data.user);

        // Redirigir según rol
        if (data.user.rol === ROLES.ADMIN) {
          window.location.href = ROUTES.admin;
        } else if (data.user.rol === ROLES.COCINA) {
          window.location.href = ROUTES.cocina;
        } else {
          showError("Rol desconocido. Contactá al administrador.");
        }

      } catch (error) {
        // El backend devuelve 401 con detail: "Credenciales inválidas"
        if (error.status === 401) {
          showError("Email o contraseña incorrectos.");
        } else if (error.status === 0) {
          showError("No se pudo conectar con el servidor. Verificá la conexión.");
        } else {
          showError(error.message || "Ocurrió un error inesperado.");
        }
      } finally {
        setLoading(false);
      }
    }
  </script>
</body>
</html>
