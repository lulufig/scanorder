<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="auth/css/login.css" />
</head>

<body>
  <div class="login-shell">

    <!-- Panel de marca -->
    <div class="login-brand">

      <div class="login-brand-main">

      <!-- Ilustración: mockup estático del panel (no son datos reales) -->
      <div class="login-illustration" aria-hidden="true">
        <img src="assets/img/preview-cards.png" alt="" class="illu-preview-img" />
      </div>

      <div class="login-brand-copy">
        <h2 class="login-brand-headline">Tu operación<br>en tiempo real.</h2>
        <p class="login-brand-sub">Mesas, pedidos, cocina y ventas sincronizados desde un solo panel.</p>
      </div>

      </div>

    </div>

    <!-- Card de login -->
    <div class="login-card">
      <div class="login-card-inner" id="login-card">

      <div class="auth-logo-wrap">
        <img src="assets/img/logo-scanorder.png" alt="ScanOrder" class="auth-logo" />
      </div>

      <h1 class="login-title">Iniciar sesión</h1>
      <p class="login-subtitle">Ingresá con tu cuenta para acceder al panel</p>

      <form class="login-form" id="login-form" novalidate>

        <!-- Email -->
        <div class="field-boxed">
          <i data-lucide="mail" class="field-icon"></i>
          <label class="sr-only" for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            placeholder="Correo electrónico"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
          />
        </div>

        <!-- Contraseña -->
        <div class="field-boxed">
          <i data-lucide="lock" class="field-icon"></i>
          <label class="sr-only" for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            placeholder="Contraseña"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="field-toggle"
            id="toggle-password"
            aria-label="Mostrar contraseña"
            onclick="togglePassword()"
          >
            <i data-lucide="eye" class="icon-show"></i>
            <i data-lucide="eye-off" class="icon-hide" style="display:none;"></i>
          </button>
        </div>

        <!-- Error -->
        <div class="error-box" id="error-box" role="alert">
          <span class="error-icon">!</span>
          <span id="error-msg">Credenciales inválidas</span>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn-login" id="btn-login">
          Iniciar sesión
        </button>

        <!-- Forgot password -->
        <p class="login-link-center">
          <a href="/frontend/forgot-password.html" class="link-muted">
            ¿Olvidaste tu contraseña?
          </a>
        </p>

      </form>

      <!-- Footer -->
      <p class="footer-text">
        Acceso exclusivo para personal autorizado
      </p>

      </div>
    </div>

  </div>

  <!-- Scripts base — orden obligatorio -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer onload="lucide.createIcons()"></script>

  <script src="auth/js/login.js"></script>
</body>
</html>
