<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Usuarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/mesas.css" />
  <style>
    /* ── Tabla de usuarios ── */
    .usu-table-wrap { overflow-x: auto; margin-top: 1.5rem; }
    .usu-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(34,10,4,.07); }
    .usu-table th {
      text-align: left; padding: 0.65rem 1rem;
      background: #f5e9d4; color: #7A5C3A;
      font-weight: 800; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.06em; border-bottom: 2px solid #e8d5b5;
    }
    .usu-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #f0e3cc;
      color: #2d1a0e; vertical-align: middle;
    }
    .usu-table tr:last-child td { border-bottom: none; }
    .usu-table tr:hover td { background: #fdf5e6; }

    /* Badges */
    .badge { display: inline-block; padding: .22em .72em; border-radius: 999px; font-size: .75rem; font-weight: 800; }
    .badge-admin  { background: #fef3c7; color: #92400e; }
    .badge-mozo   { background: #dbeafe; color: #1e40af; }
    .badge-temp   { background: #fef2f2; color: #b91c1c; }
    .badge-ok     { background: #f0fdf4; color: #15803d; }
    .badge-inactivo { background: #f3f4f6; color: #6b7280; }

    /* Botones acción en tabla */
    .acciones-cell { display: flex; gap: .4rem; flex-wrap: wrap; }
    .btn-editar, .btn-reenviar, .btn-toggle {
      background: transparent; border: 1px solid #D8C8B7;
      color: #7A5C3A; padding: .3rem .7rem; border-radius: 6px;
      cursor: pointer; font-size: .78rem; font-weight: 700;
      transition: all .15s;
    }
    .btn-editar:hover { border-color: #7A5C3A; background: #fdf5e6; }
    .btn-reenviar:hover { border-color: #B91C1C; color: #B91C1C; }
    .btn-editar:disabled, .btn-reenviar:disabled, .btn-toggle:disabled { opacity: .5; cursor: not-allowed; }
    .btn-toggle.desactivar:hover { border-color: #B91C1C; color: #B91C1C; }
    .btn-toggle.activar { border-color: #15803d; color: #15803d; }
    .btn-toggle.activar:hover { background: #f0fdf4; }

    /* Header de página */
    .page-actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem; }
    .btn-nuevo {
      background: #B91C1C; color: #fff; border: none;
      padding: .6rem 1.2rem; border-radius: 8px; font-size: .88rem;
      font-weight: 800; cursor: pointer; transition: background .2s;
    }
    .btn-nuevo:hover { background: #991B1B; }

    /* Toast */
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      padding: .75rem 1.25rem; border-radius: 8px; font-size: .875rem;
      font-weight: 700; opacity: 0; transform: translateY(8px);
      transition: opacity .25s, transform .25s; pointer-events: none; z-index: 500;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }
    .toast-ok    { background: #15803d; color: #fff; }
    .toast-error { background: #B91C1C; color: #fff; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(34,10,4,.45); z-index: 200;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: 12px;
      padding: 2rem; width: 100%; max-width: 440px;
      box-shadow: 0 20px 50px rgba(34,10,4,.2);
      display: flex; flex-direction: column; gap: 1rem;
    }
    .modal-box h3 { font-size: 1.1rem; color: #21130F; font-weight: 800; margin: 0; }
    .modal-box label { font-size: .78rem; font-weight: 800; color: #5F4B3B; display: block; margin-bottom: .3rem; text-transform: uppercase; letter-spacing: .04em; }
    .modal-box input, .modal-box select {
      width: 100%; padding: .6rem .9rem; border: 1.5px solid #D8C8B7;
      border-radius: 8px; font-size: .93rem; color: #21130F; background: #fff;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .modal-box input:focus, .modal-box select:focus {
      border-color: #B91C1C; box-shadow: 0 0 0 3px rgba(185,28,28,.1);
    }
    .modal-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: .25rem; }
    .btn-cancel { background: transparent; border: 1.5px solid #D8C8B7; color: #7A5C3A; padding: .55rem 1.1rem; border-radius: 7px; cursor: pointer; font-size: .88rem; font-weight: 700; }
    .btn-cancel:hover { border-color: #B91C1C; color: #B91C1C; }
    .btn-crear { background: #B91C1C; color: #fff; border: none; padding: .55rem 1.3rem; border-radius: 7px; cursor: pointer; font-size: .88rem; font-weight: 800; }
    .btn-crear:hover { background: #991B1B; }
    .btn-crear:disabled { opacity: .6; cursor: not-allowed; }
    .modal-error { background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C; border-radius: 7px; padding: .55rem .9rem; font-size: .85rem; font-weight: 700; display: none; }
    .modal-error.visible { display: block; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: #9a7a5a; font-size: .95rem; }
  </style>
</head>

<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-logo">Maven<span>Burger</span></div>

    <div class="sidebar-section">Reportes</div>
    <a href="index.html" class="sidebar-link">Reportes</a>

    <div class="sidebar-section">Gestión</div>
    <a href="mesas.html"      class="sidebar-link">Mesas</a>
    <a href="productos.html"  class="sidebar-link">Productos</a>
    <a href="inventario.html" class="sidebar-link">Inventario</a>
    <a href="usuarios.html"   class="sidebar-link active">Usuarios</a>

    <div class="sidebar-bottom">
      <div class="user-info">
        Panel de administración
        <span class="user-name" id="sidebar-username">—</span>
      </div>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <div class="page-header">
      <div class="page-actions">
        <div>
          <h1 class="page-title">Usuarios</h1>
          <p class="page-subtitle">Cuentas de mozos y administradores</p>
        </div>
        <button class="btn-nuevo" onclick="abrirModalCrear()">+ Nuevo usuario</button>
      </div>
    </div>

    <!-- Tabla -->
    <div class="usu-table-wrap">
      <table class="usu-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="5" class="empty-state">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- ===== MODAL CREAR USUARIO ===== -->
  <div class="modal-overlay" id="modal-crear">
    <div class="modal-box">
      <h3>Nuevo usuario</h3>
      <div id="modal-error" class="modal-error"></div>
      <div>
        <label for="m-nombre">Nombre completo</label>
        <input type="text" id="m-nombre" placeholder="Ej: María García" autocomplete="off">
      </div>
      <div>
        <label for="m-email">Correo electrónico</label>
        <input type="email" id="m-email" placeholder="maria@mavenburger.com" autocomplete="off">
      </div>
      <div>
        <label for="m-rol">Rol</label>
        <select id="m-rol">
          <option value="mozo">Mozo</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <p style="font-size:.8rem;color:#9a7a5a;margin-top:-.25rem;">
        Se generará una contraseña temporal y se enviará al email indicado.
      </p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-crear" id="btn-crear-confirm" onclick="crearUsuario()">Crear usuario</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL EDITAR USUARIO ===== -->
  <div class="modal-overlay" id="modal-editar">
    <div class="modal-box">
      <h3>Editar usuario</h3>
      <div id="modal-editar-error" class="modal-error"></div>
      <div>
        <label for="e-nombre">Nombre completo</label>
        <input type="text" id="e-nombre" autocomplete="off">
      </div>
      <div>
        <label for="e-email">Correo electrónico</label>
        <input type="email" id="e-email" autocomplete="off">
      </div>
      <div>
        <label for="e-rol">Rol</label>
        <select id="e-rol">
          <option value="mozo">Mozo</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModalEditar()">Cancelar</button>
        <button class="btn-crear" id="btn-editar-confirm" onclick="guardarEdicion()">Guardar cambios</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    requireAuth(ROLES.ADMIN);

    document.getElementById("sidebar-username").textContent = getUserNombre() || "—";

    // ── Datos ──────────────────────────────────────────────────────────────────

    let _usuarios = [];

    async function cargarUsuarios() {
      try {
        _usuarios = await fetchAPI("/admin/usuarios");
        renderTabla();
      } catch (e) {
        document.getElementById("tabla-body").innerHTML =
          `<tr><td colspan="5" class="empty-state">Error al cargar usuarios: ${e.message}</td></tr>`;
      }
    }

    function renderTabla() {
      const tbody = document.getElementById("tabla-body");
      if (!_usuarios.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No hay usuarios registrados.</td></tr>`;
        return;
      }
      tbody.innerHTML = _usuarios.map(u => `
        <tr>
          <td><strong>${esc(u.nombre)}</strong></td>
          <td style="color:#7A5C3A;">${esc(u.email)}</td>
          <td><span class="badge badge-${u.rol}">${u.rol}</span></td>
          <td>${estadoBadge(u)}</td>
          <td>
            <div class="acciones-cell">
              <button class="btn-editar" onclick="abrirModalEditar(${u.id_usuario})"
                title="Editar nombre, email o rol">
                Editar
              </button>
              <button class="btn-reenviar" onclick="reenviarBienvenida(${u.id_usuario}, this)"
                title="Genera nueva contraseña temporal y reenvía el email"
                ${!u.activo ? "disabled" : ""}>
                Reenviar bienvenida
              </button>
              <button class="btn-toggle ${u.activo ? 'desactivar' : 'activar'}"
                onclick="toggleActivo(${u.id_usuario}, this)"
                title="${u.activo ? 'Desactivar usuario' : 'Reactivar usuario'}">
                ${u.activo ? "Desactivar" : "Reactivar"}
              </button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function estadoBadge(u) {
      if (!u.activo) return `<span class="badge badge-inactivo">Inactivo</span>`;
      if (u.debe_cambiar_password) return `<span class="badge badge-temp">Contraseña temporal</span>`;
      return `<span class="badge badge-ok">Activo</span>`;
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ── Crear usuario ──────────────────────────────────────────────────────────

    function abrirModalCrear() {
      document.getElementById("m-nombre").value = "";
      document.getElementById("m-email").value  = "";
      document.getElementById("m-rol").value    = "mozo";
      document.getElementById("modal-error").classList.remove("visible");
      document.getElementById("btn-crear-confirm").disabled = false;
      document.getElementById("modal-crear").classList.add("open");
      setTimeout(() => document.getElementById("m-nombre").focus(), 50);
    }

    function cerrarModal() {
      document.getElementById("modal-crear").classList.remove("open");
    }

    document.getElementById("modal-crear").addEventListener("click", e => {
      if (e.target === e.currentTarget) cerrarModal();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { cerrarModal(); cerrarModalEditar(); }
    });

    async function crearUsuario() {
      const nombre = document.getElementById("m-nombre").value.trim();
      const email  = document.getElementById("m-email").value.trim();
      const rol    = document.getElementById("m-rol").value;
      const errEl  = document.getElementById("modal-error");

      errEl.classList.remove("visible");

      if (!nombre) { errEl.textContent = "El nombre es obligatorio."; errEl.classList.add("visible"); return; }
      if (!email || !email.includes("@")) { errEl.textContent = "Ingresá un email válido."; errEl.classList.add("visible"); return; }

      const btn = document.getElementById("btn-crear-confirm");
      btn.disabled = true;
      btn.textContent = "Creando...";

      try {
        const nuevo = await fetchAPI("/admin/usuarios", "POST", { nombre, email, rol });
        _usuarios.unshift(nuevo);
        renderTabla();
        cerrarModal();
        showToast("Usuario creado. Se envió el email de bienvenida.", "ok");
      } catch (e) {
        errEl.textContent = e.message || "No se pudo crear el usuario.";
        errEl.classList.add("visible");
      } finally {
        btn.disabled = false;
        btn.textContent = "Crear usuario";
      }
    }

    // ── Editar usuario ─────────────────────────────────────────────────────────

    let _editandoId = null;

    function abrirModalEditar(id) {
      const u = _usuarios.find(x => x.id_usuario === id);
      if (!u) return;
      _editandoId = id;
      document.getElementById("e-nombre").value = u.nombre;
      document.getElementById("e-email").value  = u.email;
      document.getElementById("e-rol").value    = u.rol;
      document.getElementById("modal-editar-error").classList.remove("visible");
      document.getElementById("btn-editar-confirm").disabled = false;
      document.getElementById("btn-editar-confirm").textContent = "Guardar cambios";
      document.getElementById("modal-editar").classList.add("open");
      setTimeout(() => document.getElementById("e-nombre").focus(), 50);
    }

    function cerrarModalEditar() {
      document.getElementById("modal-editar").classList.remove("open");
      _editandoId = null;
    }

    document.getElementById("modal-editar").addEventListener("click", e => {
      if (e.target === e.currentTarget) cerrarModalEditar();
    });

    async function guardarEdicion() {
      const nombre = document.getElementById("e-nombre").value.trim();
      const email  = document.getElementById("e-email").value.trim();
      const rol    = document.getElementById("e-rol").value;
      const errEl  = document.getElementById("modal-editar-error");

      errEl.classList.remove("visible");

      if (!nombre) { errEl.textContent = "El nombre es obligatorio."; errEl.classList.add("visible"); return; }
      if (!email || !email.includes("@")) { errEl.textContent = "Ingresá un email válido."; errEl.classList.add("visible"); return; }

      const btn = document.getElementById("btn-editar-confirm");
      btn.disabled = true;
      btn.textContent = "Guardando...";

      try {
        const actualizado = await fetchAPI(`/admin/usuarios/${_editandoId}`, "PUT", { nombre, email, rol });
        const idx = _usuarios.findIndex(x => x.id_usuario === _editandoId);
        if (idx !== -1) _usuarios[idx] = { ..._usuarios[idx], ...actualizado };
        renderTabla();
        cerrarModalEditar();
        showToast("Usuario actualizado.", "ok");
      } catch (e) {
        errEl.textContent = e.message || "No se pudo actualizar el usuario.";
        errEl.classList.add("visible");
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar cambios";
      }
    }

    // ── Desactivar / Reactivar ────────────────────────────────────────────────

    async function toggleActivo(id, btnEl) {
      const desactivando = btnEl.classList.contains("desactivar");
      btnEl.disabled = true;
      btnEl.textContent = desactivando ? "Desactivando..." : "Reactivando...";
      try {
        const res = await fetchAPI(`/admin/usuarios/${id}/activo`, "PATCH");
        const u = _usuarios.find(x => x.id_usuario === id);
        if (u) u.activo = res.activo;
        renderTabla();
        showToast(res.activo ? "Usuario reactivado." : "Usuario desactivado.", "ok");
      } catch (e) {
        showToast(e.message || "Error al cambiar estado.", "error");
        btnEl.disabled = false;
        btnEl.textContent = desactivando ? "Desactivar" : "Reactivar";
      }
    }

    // ── Reenviar bienvenida ────────────────────────────────────────────────────

    async function reenviarBienvenida(id, btnEl) {
      btnEl.disabled = true;
      btnEl.textContent = "Enviando...";
      try {
        await fetchAPI(`/admin/usuarios/${id}/reenviar-bienvenida`, "POST");
        showToast("Email de bienvenida reenviado.", "ok");
        // Marcar el usuario como "contraseña temporal" localmente
        const u = _usuarios.find(x => x.id_usuario === id);
        if (u) u.debe_cambiar_password = true;
        renderTabla();
      } catch (e) {
        showToast(e.message || "Error al reenviar.", "error");
        btnEl.disabled = false;
        btnEl.textContent = "Reenviar bienvenida";
      }
    }

    // ── Toast ──────────────────────────────────────────────────────────────────

    let _toastTimer = null;
    function showToast(msg, tipo = "ok") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `toast toast-${tipo} visible`;
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove("visible"), 3500);
    }

    // ── Init ───────────────────────────────────────────────────────────────────
    cargarUsuarios();
  </script>
</body>
</html>
