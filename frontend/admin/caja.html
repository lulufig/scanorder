<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Mi caja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="css/admin-shell.css" />
  <link rel="stylesheet" href="css/caja.css" />
</head>

<body>

  <div class="mobile-topbar">
    <button class="mobile-menu-btn" type="button" onclick="toggleSidebar()" aria-label="Abrir menú">
      <i data-lucide="menu"></i>
    </button>
    <div class="mobile-topbar-logo">ScanOrder</div>
  </div>
  <div class="sidebar-overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar">
    <div class="sidebar-logo">ScanOrder</div>

    <div class="sidebar-section" data-role="admin">Reportes</div>
    <a href="index.html" class="sidebar-link" data-role="admin"><i data-lucide="layout-dashboard"></i>Dashboard</a>
    <a href="reportes.html" class="sidebar-link" data-role="admin"><i data-lucide="bar-chart-3"></i>Reportes</a>

    <div class="sidebar-section">Gestión</div>
    <a href="mesas.html"      class="sidebar-link"><i data-lucide="layout-grid"></i>Mesas</a>
    <a href="caja.html"       class="sidebar-link active"><i data-lucide="wallet"></i>Mi caja</a>
    <a href="mesas-qr.html"   class="sidebar-link" data-role="admin"><i data-lucide="qr-code"></i>QR Mesas</a>
    <a href="productos.html"  class="sidebar-link" data-role="admin"><i data-lucide="utensils"></i>Productos</a>
    <a href="inventario.html" class="sidebar-link" data-role="admin"><i data-lucide="package"></i>Inventario</a>
    <a href="usuarios.html"   class="sidebar-link" data-role="admin"><i data-lucide="users"></i>Usuarios</a>

    <div class="sidebar-bottom">
      <div class="user-info">
        <span id="sidebar-rol-label">Administración</span>
        <span class="user-name" id="sidebar-username">—</span>
      </div>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Mi caja</h1>
        <p class="page-subtitle" id="caja-subtitle">Cobros que registraste en tu turno</p>
      </div>
      <input class="form-input caja-fecha" type="date" id="caja-fecha" onchange="cargarCaja()" />
    </div>

    <div class="caja-stats" id="caja-stats">
      <div class="caja-stat">
        <span class="caja-stat-label">Mesas cobradas</span>
        <strong class="caja-stat-value" id="st-mesas">—</strong>
      </div>
      <div class="caja-stat">
        <span class="caja-stat-label">Total cobrado</span>
        <strong class="caja-stat-value" id="st-total">—</strong>
      </div>
      <div class="caja-stat">
        <span class="caja-stat-label">Propinas</span>
        <strong class="caja-stat-value" id="st-propinas">—</strong>
      </div>
      <div class="caja-stat caja-stat-destacado">
        <span class="caja-stat-label">Efectivo a rendir</span>
        <strong class="caja-stat-value" id="st-rendir">—</strong>
      </div>
    </div>

    <div class="card caja-card">
      <div class="card-header">
        <div>
          <div class="card-title">Desglose por método</div>
        </div>
      </div>
      <div class="caja-metodos" id="caja-metodos"></div>
    </div>

    <div class="card caja-card">
      <div class="card-header">
        <div>
          <div class="card-title">Mis cobros del día</div>
          <div class="card-subtitle" id="caja-cobros-count">—</div>
        </div>
      </div>
      <div class="caja-cobros-wrap" id="caja-cobros"></div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/sidebar-toggle.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer onload="lucide.createIcons()"></script>
  <script src="js/caja.js"></script>
</body>
</html>
