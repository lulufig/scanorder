<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/mesas.css" />
  <style>
    /* ── Tabla de inventario ── */
    .inv-table-wrap { overflow-x: auto; margin-top: 1.5rem; }
    .inv-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    .inv-table th {
      text-align: left; padding: 0.6rem 0.9rem;
      background: var(--bg-card, #1e1e2e); color: var(--text-dim, #888);
      font-weight: 600; font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: 0.05em; border-bottom: 1px solid var(--border, #2a2a3a);
    }
    .inv-table td {
      padding: 0.7rem 0.9rem;
      border-bottom: 1px solid var(--border, #2a2a3a);
      color: var(--text, #e0e0f0);
    }
    .inv-table tr:hover td { background: var(--bg-hover, #252535); }

    /* Estado badges */
    .badge { display: inline-block; padding: 0.25em 0.7em; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
    .badge-ok     { background: #1a3a2a; color: #4ade80; }
    .badge-bajo   { background: #3a3010; color: #facc15; }
    .badge-agotado{ background: #3a1010; color: #f87171; }

    /* Alerta global */
    .alerta-banner {
      display: none; background: #3a1010; color: #f87171;
      padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.9rem;
      font-weight: 600; margin-bottom: 1rem; align-items: center; gap: 0.5rem;
    }
    .alerta-banner.visible { display: flex; }

    /* Filtro */
    .inv-filters { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .inv-filters select, .inv-filters input {
      padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid var(--border, #2a2a3a);
      background: var(--bg-card, #1e1e2e); color: var(--text, #e0e0f0); font-size: 0.88rem;
    }

    /* Modal ajuste */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--bg-card, #1e1e2e); border-radius: 12px;
      padding: 2rem; width: 100%; max-width: 400px;
      border: 1px solid var(--border, #2a2a3a); display: flex; flex-direction: column; gap: 1rem;
    }
    .modal-box h3 { margin: 0; font-size: 1.05rem; }
    .modal-box label { font-size: 0.82rem; color: var(--text-dim, #888); display: block; margin-bottom: 0.25rem; }
    .modal-box input, .modal-box textarea {
      width: 100%; padding: 0.5rem 0.75rem; border-radius: 6px;
      border: 1px solid var(--border, #2a2a3a); background: var(--bg, #13131f);
      color: var(--text, #e0e0f0); font-size: 0.9rem; box-sizing: border-box;
    }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
    .btn-cancel { background: transparent; border: 1px solid var(--border, #2a2a3a); color: var(--text-dim, #888); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
    .btn-guardar { background: #4f46e5; color: #fff; border: none; padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-guardar:hover { background: #4338ca; }

    /* Botón ajustar en tabla */
    .btn-ajustar {
      background: transparent; border: 1px solid var(--border, #2a2a3a);
      color: var(--text-dim, #888); padding: 0.3rem 0.65rem; border-radius: 5px;
      cursor: pointer; font-size: 0.8rem; transition: all 0.15s;
    }
    .btn-ajustar:hover { border-color: #4f46e5; color: #4f46e5; }

    .stock-num { font-family: 'DM Mono', monospace; font-weight: 500; }
  </style>
</head>

<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-logo">Maven<span>Burger</span></div>

    <div class="sidebar-section" data-role="admin">Reportes</div>
    <a href="index.html" class="sidebar-link" data-role="admin"> Reportes</a>

    <div class="sidebar-section">Gestión</div>
    <a href="mesas.html"      class="sidebar-link"> Mesas</a>
    <a href="productos.html"  class="sidebar-link" data-role="admin"> Productos</a>
    <a href="inventario.html" class="sidebar-link active" data-role="admin"> Inventario</a>
    <a href="usuarios.html"   class="sidebar-link" data-role="admin"> Usuarios</a>

    <div class="sidebar-bottom">
      <div class="user-info">
        Panel de administración
        <span class="user-name" id="sidebar-username">—</span>
      </div>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <div class="page-header">
      <div>
        <h1 class="page-title">Inventario</h1>
        <p class="page-subtitle">Control de stock por producto</p>
      </div>
    </div>

    <!-- Banner de alerta global -->
    <div class="alerta-banner" id="alerta-bajo-minimo">
      ⚠ Hay <strong id="alerta-count">0</strong> producto(s) con stock por debajo del mínimo
    </div>

    <!-- Filtros -->
    <div class="inv-filters">
      <select id="filtro-estado" onchange="renderTabla()">
        <option value="">Todos los estados</option>
        <option value="OK">OK</option>
        <option value="BAJO">Bajo mínimo</option>
        <option value="AGOTADO">Agotado</option>
      </select>
      <input type="text" id="filtro-nombre" placeholder="Buscar producto…" oninput="renderTabla()" />
    </div>

    <!-- Tabla -->
    <div class="inv-table-wrap">
      <table class="inv-table">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Stock actual</th>
            <th>Stock mínimo</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="inv-tbody">
          <tr><td colspan="6" style="text-align:center;padding:2rem;color:#888">Cargando…</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- ===== MODAL AJUSTE ===== -->
  <div class="modal-overlay" id="modal-ajuste">
    <div class="modal-box">
      <h3>Ajustar Stock — <span id="modal-nombre-prod">—</span></h3>
      <input type="hidden" id="modal-id-prod" />
      <div>
        <label>Stock actual</label>
        <input type="number" id="modal-stock-actual" min="0" />
      </div>
      <div>
        <label>Stock mínimo (umbral de alerta)</label>
        <input type="number" id="modal-stock-minimo" min="0" />
      </div>
      <div>
        <label>Motivo</label>
        <textarea id="modal-motivo" rows="2" placeholder="Ej: reposición semanal"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-guardar" onclick="guardarAjuste()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Scripts — orden obligatorio -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="js/inventario.js"></script>
</body>
</html>
