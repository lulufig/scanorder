<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="css/admin-shell.css" />
  <link rel="stylesheet" href="css/mesas.css" />
  <link rel="stylesheet" href="css/inventario.css" />
</head>

<body>

  <!-- ===== BARRA MÓVIL (solo visible en pantallas chicas) ===== -->
  <div class="mobile-topbar">
    <button class="mobile-menu-btn" type="button" onclick="toggleSidebar()" aria-label="Abrir menú">
      <i data-lucide="menu"></i>
    </button>
    <div class="mobile-topbar-logo">ScanOrder</div>
  </div>
  <div class="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-logo">ScanOrder</div>

    <div class="sidebar-section" data-role="admin">Reportes</div>
    <a href="index.html" class="sidebar-link" data-role="admin"><i data-lucide="layout-dashboard"></i>Dashboard</a>
    <a href="reportes.html" class="sidebar-link" data-role="admin"><i data-lucide="bar-chart-3"></i>Reportes</a>

    <div class="sidebar-section">Gestión</div>
    <a href="mesas.html"      class="sidebar-link"><i data-lucide="layout-grid"></i>Mesas</a>
    <a href="mesas-qr.html"   class="sidebar-link" data-role="admin"><i data-lucide="qr-code"></i>QR Mesas</a>
    <a href="productos.html"  class="sidebar-link" data-role="admin"><i data-lucide="utensils"></i>Productos</a>
    <a href="inventario.html" class="sidebar-link active" data-role="admin"><i data-lucide="package"></i>Inventario</a>
    <a href="usuarios.html"   class="sidebar-link" data-role="admin"><i data-lucide="users"></i>Usuarios</a>

    <div class="sidebar-bottom">
      <div class="user-info">
        <span id="sidebar-rol-label">Administración</span>
        <span class="user-name" id="sidebar-username">—</span>
      </div>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <div class="page-header">
      <div>
        <h1 class="page-title">Inventario</h1>
        <p class="page-subtitle">Control de stock por producto</p>
      </div>
      <a class="btn-primary" href="inventario-rapida.html">
        <i data-lucide="list-checks"></i>
        Reposición rápida
      </a>
    </div>

    <!-- Banner de alerta global -->
    <div class="alerta-banner" id="alerta-bajo-minimo">
      <i data-lucide="triangle-alert"></i>
      Hay <strong id="alerta-count">0</strong> producto(s) con stock por debajo del mínimo
    </div>

    <!-- Filtros -->
    <div class="inv-filters">
      <div class="inv-search">
        <i data-lucide="search"></i>
        <input type="text" id="filtro-nombre" placeholder="Buscar producto…" oninput="renderTabla()" />
      </div>
      <select id="filtro-estado" onchange="renderTabla()">
        <option value="CRITICOS">Críticos</option>
        <option value="">Todos los estados</option>
        <option value="OK">Stock OK</option>
        <option value="BAJO">Bajo mínimo</option>
        <option value="AGOTADO">Agotado</option>
      </select>
    </div>

    <!-- Tabla -->
    <div class="inv-table-wrap">
      <table class="inv-table">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Stock</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="inv-tbody">
          <tr><td colspan="5" style="text-align:center;padding:2rem;color:#888">Cargando…</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- ===== MODAL AJUSTE ===== -->
  <div class="modal-overlay" id="modal-ajuste">
    <div class="modal-box">
      <h3>Ajustar Stock — <span id="modal-nombre-prod">—</span></h3>
      <input type="hidden" id="modal-id-prod" />
      <div>
        <label>Stock actual</label>
        <input type="number" id="modal-stock-actual" min="0" />
      </div>
      <div>
        <label>Stock mínimo (umbral de alerta)</label>
        <input type="number" id="modal-stock-minimo" min="0" />
      </div>
      <div>
        <label>Motivo</label>
        <textarea id="modal-motivo" rows="2" placeholder="Ej: reposición semanal"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-guardar" onclick="guardarAjuste()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Scripts — orden obligatorio -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/sidebar-toggle.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer onload="lucide.createIcons()"></script>
  <script src="js/inventario.js"></script>
</body>
</html>
