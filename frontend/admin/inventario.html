<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin-base.css" />
  <link rel="stylesheet" href="css/inventario.css" />
</head>

<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-logo">Maven<span>Burger</span></div>

    <div class="sidebar-section">Reportes</div>
    <a href="index.html" class="sidebar-link">Reportes</a>

    <div class="sidebar-section">Gestión</div>
    <a href="mesas.html"      class="sidebar-link">Mesas</a>
    <a href="productos.html"  class="sidebar-link">Productos</a>
    <a href="inventario.html" class="sidebar-link active">Inventario</a>
    <div class="sidebar-section">Usuarios</div>
    <a href="usuarios.html"   class="sidebar-link">Usuarios</a>

    <div class="sidebar-bottom">
      <div class="user-info">
        Panel de administración
        <span class="user-name" id="sidebar-username">—</span>
      </div>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <div class="page-header">
      <div>
        <h1 class="page-title">Inventario</h1>
        <p class="page-subtitle">Control de stock por producto</p>
      </div>
    </div>

    <!-- Banner de alerta global -->
    <div class="alerta-banner" id="alerta-bajo-minimo">
      <div class="alerta-text">
        <span class="alerta-dot"></span>
        <span>Hay <strong id="alerta-count">0</strong> producto(s) con stock por debajo del mínimo</span>
      </div>
      <button type="button" class="btn-ver-criticos" onclick="verCriticos()">Ver críticos</button>
    </div>

    <div class="inv-panel">
      <!-- Filtros -->
      <div class="inv-filters">
        <div class="inv-search">
          <input type="text" id="filtro-nombre" placeholder="Buscar producto..." oninput="renderTabla()" />
        </div>
        <div class="inv-filter">
          <select id="filtro-estado" onchange="renderTabla()">
            <option value="">Todos los estados</option>
            <option value="CRITICOS">Críticos</option>
            <option value="OK">Stock OK</option>
            <option value="BAJO">Bajo mínimo</option>
            <option value="AGOTADO">Agotado</option>
          </select>
        </div>
      </div>

      <!-- Tabla -->
      <div class="inv-table-wrap">
        <table class="inv-table">
          <colgroup>
            <col>
            <col>
            <col>
            <col>
            <col>
          </colgroup>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Stock</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="inv-tbody">
            <tr><td colspan="5" class="table-empty">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- ===== MODAL AJUSTE ===== -->
  <div class="modal-overlay" id="modal-ajuste">
    <div class="modal-box">
      <h3>Ajustar Stock — <span id="modal-nombre-prod">—</span></h3>
      <input type="hidden" id="modal-id-prod" />
      <div>
        <label>Stock actual</label>
        <input type="number" id="modal-stock-actual" min="0" />
      </div>
      <div>
        <label>Stock mínimo (umbral de alerta)</label>
        <input type="number" id="modal-stock-minimo" min="0" />
      </div>
      <div>
        <label>Motivo</label>
        <textarea id="modal-motivo" rows="2" placeholder="Ej: reposición semanal"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-guardar" onclick="guardarAjuste()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Scripts — orden obligatorio -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="js/inventario.js"></script>
</body>
</html>
