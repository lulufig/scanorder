<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña — ScanOrder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #FFF8ED;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      border-top: 5px solid #B91C1C;
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 36px rgba(33,19,15,0.14);
    }
    .brand {
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8A5A1F;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.4rem; color: #21130F; margin-bottom: .4rem; font-weight: 800; }
    .subtitle { color: #7A6654; font-size: .88rem; margin-bottom: 1.75rem; line-height: 1.5; }
    label { display: block; font-size: .8rem; font-weight: 700; color: #5F4B3B; margin-bottom: .3rem; letter-spacing: .04em; text-transform: uppercase; }
    input {
      width: 100%; padding: .7rem 1rem;
      border: 1.5px solid #D8C8B7;
      border-radius: 8px; font-size: .95rem; outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff; color: #21130F;
    }
    input:focus { border-color: #B91C1C; box-shadow: 0 0 0 3px rgba(185,28,28,.1); }
    .field { margin-bottom: 1rem; }
    .btn {
      width: 100%; padding: .85rem; background: #B91C1C; color: #fff;
      border: none; border-radius: 8px; font-size: .95rem; font-weight: 800;
      cursor: pointer; transition: background .2s; margin-top: .5rem;
    }
    .btn:hover:not(:disabled) { background: #991B1B; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .msg {
      padding: .65rem 1rem; border-radius: 8px;
      font-size: .875rem; margin-bottom: 1rem; display: none;
    }
    .msg.visible { display: block; }
    .msg-error   { background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C; font-weight: 700; }
    .msg-success { background: #F0FDF4; border: 1px solid #BBF7D0; color: #15803D; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Maven Burger</div>
    <h1>Cambiar contraseña</h1>
    <p class="subtitle" id="subtitulo">Elegí una contraseña nueva segura.</p>

    <div id="msg-error"   class="msg msg-error"></div>
    <div id="msg-success" class="msg msg-success"></div>

    <div class="field" id="campo-actual-wrap">
      <label for="actual">Contraseña actual</label>
      <input type="password" id="actual" placeholder="Tu contraseña actual" autocomplete="current-password">
    </div>
    <div class="field">
      <label for="nueva">Nueva contraseña</label>
      <input type="password" id="nueva" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar" placeholder="Repetí la contraseña" autocomplete="new-password">
    </div>
    <button class="btn" id="btn-cambiar" onclick="cambiarPassword()">Guardar contraseña</button>
  </div>

  <script src="/frontend/assets/js/config.js"></script>
  <script src="/frontend/assets/js/auth.js"></script>
  <script src="/frontend/assets/js/api.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = "/frontend/login.html";
    }

    // Adaptar el texto según si es primer login forzado o cambio voluntario
    const _u = getUser();
    const _esPrimerLogin = _u && _u.debe_cambiar_password;
    if (_esPrimerLogin) {
      document.getElementById("subtitulo").textContent =
        "Es tu primer ingreso. Ingresá la contraseña temporal que recibiste por email y elegí una nueva.";
    } else {
      document.getElementById("subtitulo").textContent =
        "Ingresá tu contraseña actual y elegí una nueva.";
    }

    document.getElementById("confirmar").addEventListener("keydown", e => {
      if (e.key === "Enter") cambiarPassword();
    });

    function showError(msg) {
      const el = document.getElementById("msg-error");
      el.textContent = msg;
      el.classList.add("visible");
      document.getElementById("msg-success").classList.remove("visible");
    }

    function showSuccess(msg) {
      const el = document.getElementById("msg-success");
      el.textContent = msg;
      el.classList.add("visible");
      document.getElementById("msg-error").classList.remove("visible");
    }

    async function cambiarPassword() {
      const actual    = document.getElementById("actual").value;
      const nueva     = document.getElementById("nueva").value;
      const confirmar = document.getElementById("confirmar").value;

      if (!actual) { showError("Ingresá tu contraseña actual."); return; }
      if (!nueva || !confirmar) { showError("Completá todos los campos."); return; }
      if (nueva.length < 8) { showError("La nueva contraseña debe tener al menos 8 caracteres."); return; }
      if (nueva !== confirmar) { showError("Las contraseñas no coinciden."); return; }

      const btn = document.getElementById("btn-cambiar");
      btn.disabled = true;
      btn.textContent = "Guardando...";

      try {
        await fetchAPI("/auth/cambiar-password", "POST", {
          password_actual: actual,
          nueva_password:  nueva,
        });

        showSuccess("Contraseña actualizada. Redirigiendo...");

        setTimeout(() => {
          const user = getUser();
          if (user && user.rol === "admin") {
            window.location.href = "/frontend/admin/index.html";
          } else {
            window.location.href = "/frontend/admin/mesas.html";
          }
        }, 1500);

      } catch (error) {
        showError(error.message || "No se pudo cambiar la contraseña.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar contraseña";
      }
    }
  </script>
</body>
</html>
