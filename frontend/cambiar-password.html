<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña — ScanOrder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a0a06;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.4rem; color: #C0392B; margin-bottom: .5rem; }
    .subtitle { color: #666; font-size: .9rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: .85rem; font-weight: 600; color: #333; margin-bottom: .3rem; }
    input {
      width: 100%; padding: .7rem 1rem; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 1rem; outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #C0392B; }
    .field { margin-bottom: 1rem; }
    .btn {
      width: 100%; padding: .85rem; background: #C0392B; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background .2s; margin-top: .5rem;
    }
    .btn:hover:not(:disabled) { background: #a93226; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error {
      background: #fdecea; border: 1px solid #f5c6cb;
      color: #c0392b; padding: .7rem 1rem; border-radius: 8px;
      font-size: .9rem; margin-bottom: 1rem; display: none;
    }
    .error.visible { display: block; }
    .success {
      background: #e9f7ef; border: 1px solid #a9dfbf;
      color: #1e8449; padding: .7rem 1rem; border-radius: 8px;
      font-size: .9rem; margin-bottom: 1rem; display: none;
    }
    .success.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cambiar contraseña</h1>
    <p class="subtitle">
      Es tu primer ingreso. Elegí una contraseña segura para continuar.
    </p>
    <div id="error-box" class="error"></div>
    <div id="success-box" class="success"></div>
    <div class="field">
      <label for="nueva">Nueva contraseña</label>
      <input type="password" id="nueva" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar" placeholder="Repetí la contraseña" autocomplete="new-password">
    </div>
    <button class="btn" id="btn-cambiar" onclick="cambiarPassword()">Guardar contraseña</button>
  </div>

  <script src="/frontend/assets/js/config.js"></script>
  <script src="/frontend/assets/js/auth.js"></script>
  <script src="/frontend/assets/js/api.js"></script>
  <script>
    // Si no hay sesión activa, redirigir al login
    if (!isLoggedIn()) {
      window.location.href = "/frontend/login.html";
    }

    document.getElementById("confirmar").addEventListener("keydown", e => {
      if (e.key === "Enter") cambiarPassword();
    });

    function showError(msg) {
      const el = document.getElementById("error-box");
      el.textContent = msg;
      el.classList.add("visible");
      document.getElementById("success-box").classList.remove("visible");
    }

    function showSuccess(msg) {
      const el = document.getElementById("success-box");
      el.textContent = msg;
      el.classList.add("visible");
      document.getElementById("error-box").classList.remove("visible");
    }

    async function cambiarPassword() {
      const nueva    = document.getElementById("nueva").value;
      const confirmar = document.getElementById("confirmar").value;

      if (!nueva || !confirmar) {
        showError("Completá ambos campos.");
        return;
      }
      if (nueva.length < 8) {
        showError("La contraseña debe tener al menos 8 caracteres.");
        return;
      }
      if (nueva !== confirmar) {
        showError("Las contraseñas no coinciden.");
        return;
      }

      const btn = document.getElementById("btn-cambiar");
      btn.disabled = true;
      btn.textContent = "Guardando...";

      try {
        await fetchAPI("/auth/cambiar-password", "POST", { nueva_password: nueva });
        showSuccess("Contraseña actualizada. Redirigiendo...");

        setTimeout(() => {
          const user = getUser();
          if (user && user.rol === "admin") {
            window.location.href = "/frontend/admin/index.html";
          } else {
            window.location.href = "/frontend/cocina/pedidos.html";
          }
        }, 1500);

      } catch (error) {
        showError(error.message || "No se pudo cambiar la contraseña.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar contraseña";
      }
    }
  </script>
</body>
</html>
