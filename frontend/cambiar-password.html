<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Cambiar contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="auth/css/login.css" />
</head>

<body>
  <div class="login-shell">

    <!-- Panel de marca -->
    <div class="login-brand">

      <div class="illu-deco-marks" aria-hidden="true">
        <span class="illu-mark illu-mark-sq"></span>
        <span class="illu-mark illu-mark-x">×</span>
        <span class="illu-mark illu-mark-dash"></span>
      </div>
      <div class="illu-play-deco" aria-hidden="true"><i data-lucide="play"></i></div>

      <div class="login-brand-chip">
        <span class="chip-mark">S</span>
        <span class="chip-name">ScanOrder</span>
      </div>
      <p class="login-brand-caption">Sistema de gestión de pedidos</p>

      <div class="login-brand-main">

      <div class="login-illustration" aria-hidden="true">
        <img src="assets/img/preview-cards.png" alt="" class="illu-preview-img" />
      </div>

      <div class="login-brand-copy">
        <h2 class="login-brand-headline">Gestioná tu salón<br>con menos <span class="accent">fricción.</span></h2>
        <p class="login-brand-sub">ScanOrder te ayuda a tomar pedidos, gestionar tu cocina, controlar mesas y potenciar tus ventas desde un solo lugar.</p>
      </div>

      </div>

      <div class="login-brand-footer">
        <div class="illu-dot-grid"></div>
        <div class="illu-pagination"><span></span><span class="active"></span><span></span></div>
      </div>
    </div>

    <!-- Card de cambio de contraseña -->
    <div class="login-card">
      <div class="login-card-inner" id="cambiar-card">

      <h1 class="login-title">Cambiar contraseña</h1>
      <p class="login-subtitle" id="subtitulo">Elegí una contraseña nueva segura</p>

      <div class="login-form" id="form-section">

        <!-- Actual -->
        <div class="field-boxed" id="campo-actual-wrap">
          <i data-lucide="lock" class="field-icon"></i>
          <label class="sr-only" for="actual">Contraseña actual</label>
          <input
            id="actual"
            type="password"
            placeholder="Tu contraseña actual"
            autocomplete="current-password"
          />
          <button type="button" class="field-toggle" id="toggle-actual" aria-label="Mostrar contraseña" onclick="togglePw('actual')">
            <i data-lucide="eye" class="icon-show"></i>
            <i data-lucide="eye-off" class="icon-hide" style="display:none;"></i>
          </button>
        </div>

        <!-- Nueva -->
        <div class="field-boxed">
          <i data-lucide="lock" class="field-icon"></i>
          <label class="sr-only" for="nueva">Nueva contraseña</label>
          <input
            id="nueva"
            type="password"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
          />
          <button type="button" class="field-toggle" id="toggle-nueva" aria-label="Mostrar contraseña" onclick="togglePw('nueva')">
            <i data-lucide="eye" class="icon-show"></i>
            <i data-lucide="eye-off" class="icon-hide" style="display:none;"></i>
          </button>
        </div>

        <!-- Confirmar -->
        <div class="field-boxed">
          <i data-lucide="lock" class="field-icon"></i>
          <label class="sr-only" for="confirmar">Confirmar contraseña</label>
          <input
            id="confirmar"
            type="password"
            placeholder="Repetí la contraseña"
            autocomplete="new-password"
          />
          <button type="button" class="field-toggle" id="toggle-confirmar" aria-label="Mostrar contraseña" onclick="togglePw('confirmar')">
            <i data-lucide="eye" class="icon-show"></i>
            <i data-lucide="eye-off" class="icon-hide" style="display:none;"></i>
          </button>
        </div>

        <!-- Error -->
        <div class="error-box" id="error-box">
          <span class="error-icon">!</span>
          <span id="error-msg"></span>
        </div>

        <!-- Botón -->
        <button class="btn-login" id="btn-cambiar" onclick="cambiarPassword()">
          Guardar contraseña
        </button>

      </div>

      <!-- Éxito -->
      <div class="success-box success-box-block" id="success-section" style="display:none;">
        <i data-lucide="check-circle" class="success-icon"></i>
        <div>Contraseña actualizada. Redirigiendo...</div>
      </div>

      </div>
    </div>

  </div>

  <!-- Scripts base — orden obligatorio -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer onload="lucide.createIcons()"></script>

  <script>
    if (!isLoggedIn()) {
      window.location.href = "/frontend/login.html";
    }

    // Adaptar el texto según si es primer login forzado o cambio voluntario
    const _u = getUser();
    const _esPrimerLogin = _u && _u.debe_cambiar_password;
    if (_esPrimerLogin) {
      document.getElementById("subtitulo").textContent =
        "Es tu primer ingreso. Ingresá la contraseña temporal que recibiste por email y elegí una nueva.";
    } else {
      document.getElementById("subtitulo").textContent =
        "Ingresá tu contraseña actual y elegí una nueva.";
    }

    document.getElementById("confirmar").addEventListener("keydown", e => {
      if (e.key === "Enter") cambiarPassword();
    });

    function togglePw(id) {
      const input = document.getElementById(id);
      const btn = document.getElementById("toggle-" + id);
      const mostrando = input.type === "text";
      input.type = mostrando ? "password" : "text";
      btn.querySelector(".icon-show").style.display = mostrando ? "" : "none";
      btn.querySelector(".icon-hide").style.display = mostrando ? "none" : "";
      btn.setAttribute("aria-label", mostrando ? "Mostrar contraseña" : "Ocultar contraseña");
    }

    function showError(msg) {
      const box = document.getElementById("error-box");
      document.getElementById("error-msg").textContent = msg;
      box.classList.add("visible");

      const card = document.getElementById("cambiar-card");
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
    }

    function hideError() {
      document.getElementById("error-box").classList.remove("visible");
    }

    async function cambiarPassword() {
      const actual    = document.getElementById("actual").value;
      const nueva     = document.getElementById("nueva").value;
      const confirmar = document.getElementById("confirmar").value;

      hideError();

      if (!actual) { showError("Ingresá tu contraseña actual."); return; }
      if (!nueva || !confirmar) { showError("Completá todos los campos."); return; }
      if (nueva.length < 8) { showError("La nueva contraseña debe tener al menos 8 caracteres."); return; }
      if (nueva !== confirmar) { showError("Las contraseñas no coinciden."); return; }

      const btn = document.getElementById("btn-cambiar");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Guardando...';

      try {
        await fetchAPI("/auth/cambiar-password", "POST", {
          password_actual: actual,
          nueva_password:  nueva,
        });

        document.getElementById("form-section").style.display = "none";
        document.getElementById("success-section").style.display = "flex";

        setTimeout(() => {
          const user = getUser();
          if (user && user.rol === "admin") {
            window.location.href = "/frontend/admin/index.html";
          } else {
            window.location.href = "/frontend/admin/mesas.html";
          }
        }, 1500);

      } catch (error) {
        showError(error.message || "No se pudo cambiar la contraseña.");
        btn.disabled = false;
        btn.innerHTML = "Guardar contraseña";
      }
    }
  </script>
</body>
</html>
