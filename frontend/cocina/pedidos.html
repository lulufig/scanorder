<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Cocina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --dark:       #0f0f0f;
      --dark2:      #1a1a1a;
      --dark3:      #242424;
      --border:     rgba(255,255,255,0.07);
      --text:       #e8e8e8;
      --text-dim:   #888;

      /* Estados */
      --amarillo:   #F59E0B;
      --amarillo-bg:#2a2100;
      --amarillo-bd:#4a3800;
      --naranja:    #F97316;
      --naranja-bg: #2a1500;
      --naranja-bd: #4a2800;
      --verde:      #22C55E;
      --verde-bg:   #0a2a14;
      --verde-bd:   #1a4a28;

      --red:  #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      background: var(--dark2);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-family: 'Lilita One', 'Arial Black', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .logo span { color: #ef4444; }

    .cocina-badge {
      padding: 4px 12px;
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ef4444;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Indicador de polling */
    .polling-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-dim);
    }
    .polling-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--verde);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    .polling-dot.paused { background: var(--text-dim); animation: none; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    .topbar-user {
      font-size: 0.82rem;
      color: var(--text-dim);
    }
    .topbar-user strong { color: var(--text); }

    .btn-logout {
      padding: 7px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.09); color: var(--text); }

    /* ===== STATS BAR ===== */
    .stats-bar {
      background: var(--dark2);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .stat-dot.amarillo { background: var(--amarillo); }
    .stat-dot.naranja  { background: var(--naranja); }
    .stat-dot.verde    { background: var(--verde); }
    .stat-dot.rojo     { background: var(--red); }

    /*.stat-info {}*/
    .stat-num {
      font-family: 'Lilita One', 'Arial Black', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1;
    }
    .stat-num.amarillo { color: var(--amarillo); }
    .stat-num.naranja  { color: var(--naranja); }
    .stat-num.verde    { color: var(--verde); }
    .stat-num.rojo     { color: var(--red); }
    .stat-lbl {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stats-bar-divider {
      width: 1px;
      height: 32px;
      background: var(--border);
    }

    .last-update {
      margin-left: auto;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    /* ===== COLUMNAS ===== */
    .columnas {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      min-height: calc(100vh - 130px);
    }

    .columna {
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      min-height: 100%;
    }
    .columna:last-child { border-right: none; }

    .columna-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .columna-titulo {
      font-family: 'Lilita One', 'Arial Black', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .columna-titulo.amarillo { color: var(--amarillo); }
    .columna-titulo.naranja  { color: var(--naranja); }
    .columna-titulo.verde    { color: var(--verde); }
    .columna-titulo.rojo     { color: var(--red); }

    .columna-count {
      font-family: 'Lilita One', 'Arial Black', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .columna-count.amarillo { background: var(--amarillo-bg); color: var(--amarillo); border: 1px solid var(--amarillo-bd); }
    .columna-count.naranja  { background: var(--naranja-bg);  color: var(--naranja);  border: 1px solid var(--naranja-bd); }
    .columna-count.verde    { background: var(--verde-bg);    color: var(--verde);    border: 1px solid var(--verde-bd); }
    .columna-count.rojo     { background: #2a0909;            color: var(--red);      border: 1px solid #4a1515; }

    /* ===== CARD DE PEDIDO ===== */
    .pedido-card {
      background: var(--dark2);
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      overflow: hidden;
      animation: slideIn 0.3s ease both;
      transition: border-color 0.2s;
    }
    .pedido-card:hover { border-color: rgba(255,255,255,0.14); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pedido-card.amarillo { border-top: 3px solid var(--amarillo); }
    .pedido-card.naranja  { border-top: 3px solid var(--naranja); }
    .pedido-card.verde    { border-top: 3px solid var(--verde); }
    .pedido-card.rojo     { border-top: 3px solid var(--red); }

    .pedido-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .pedido-mesa {
      font-family: 'Lilita One', 'Arial Black', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text);
    }
    .pedido-id {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .pedido-hora {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      text-align: right;
    }
    .pedido-tiempo {
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 2px;
    }
    .pedido-tiempo.urgente { color: var(--red); }
    .pedido-tiempo.normal  { color: var(--amarillo); }
    .pedido-tiempo.ok      { color: var(--verde); }

    .pedido-items {
      padding: 0 16px 12px;
      border-top: 1px solid var(--border);
    }

    .pedido-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.875rem;
    }
    .pedido-item:last-child { border-bottom: none; }

    .pedido-item-nombre { color: var(--text); font-weight: 500; }
    .pedido-item-cantidad {
      font-family: 'Lilita One', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 2px 8px;
      border-radius: 6px;
      min-width: 28px;
      text-align: center;
    }
    .pedido-item-cantidad.amarillo { background: var(--amarillo-bg); color: var(--amarillo); }
    .pedido-item-cantidad.naranja  { background: var(--naranja-bg);  color: var(--naranja); }
    .pedido-item-cantidad.verde    { background: var(--verde-bg);    color: var(--verde); }
    .pedido-item-cantidad.rojo     { background: #2a0909;            color: var(--red); }

    .pedido-total {
      padding: 8px 16px;
      background: rgba(255,255,255,0.03);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .pedido-total-val {
      font-family: 'Lilita One', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text);
    }

    .pedido-observaciones {
      margin: 0 16px 12px;
      padding: 10px 12px;
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.22);
      border-radius: 8px;
      color: #fcd38a;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .pedido-observaciones strong {
      display: block;
      margin-bottom: 3px;
      color: var(--amarillo);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ===== BOTONES DE ACCIÓN ===== */
    .pedido-actions {
      padding: 10px 16px 14px;
      display: flex;
      gap: 8px;
    }

    .btn-accion {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 9px;
      font-family: 'Lilita One', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-accion:hover   { opacity: 0.85; }
    .btn-accion:active  { transform: scale(0.97); }
    .btn-accion:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-preparar {
      background: var(--naranja);
      color: white;
    }
    .btn-listo {
      background: var(--verde);
      color: white;
    }
    .btn-entregar {
      background: var(--red);
      color: white;
    }

    /* ===== EMPTY STATE ===== */
    .columna-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-dim);
    }
    .columna-empty .icon { font-size: 2rem; margin-bottom: 8px; opacity: 0.4; }
    .columna-empty p { font-size: 0.82rem; }

    /* ===== SPINNER ===== */
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      z-index: 500;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
      pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #14532d; color: #86efac; border: 1px solid #166534; }
    .toast.error   { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }

    /* ===== LOADING INICIAL ===== */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 130px);
      gap: 16px;
      color: var(--text-dim);
    }
    .loading-screen .big-spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--amarillo);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>

<body>

  <!-- ===== TOPBAR ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">Maven<span>Burger</span></div>
      <div class="cocina-badge">🍳 Cocina</div>
    </div>
    <div class="topbar-right">
      <div class="polling-indicator">
        <div class="polling-dot" id="polling-dot"></div>
        <span id="polling-label">Actualizando...</span>
      </div>
      <div class="topbar-user">
        Hola, <strong id="topbar-nombre">—</strong>
      </div>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
  </header>

  <!-- ===== STATS BAR ===== -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-dot amarillo"></div>
      <div class="stat-info">
        <div class="stat-num amarillo" id="count-pendiente">0</div>
        <div class="stat-lbl">Pendientes</div>
      </div>
    </div>
    <div class="stats-bar-divider"></div>
    <div class="stat-item">
      <div class="stat-dot rojo"></div>
      <div class="stat-info">
        <div class="stat-num rojo" id="count-confirmado">0</div>
        <div class="stat-lbl">Confirmados</div>
      </div>
    </div>
    <div class="stats-bar-divider"></div>
    <div class="stat-item">
      <div class="stat-dot naranja"></div>
      <div class="stat-info">
        <div class="stat-num naranja" id="count-preparacion">0</div>
        <div class="stat-lbl">En preparación</div>
      </div>
    </div>
    <div class="stats-bar-divider"></div>
    <div class="stat-item">
      <div class="stat-dot verde"></div>
      <div class="stat-info">
        <div class="stat-num verde" id="count-listo">0</div>
        <div class="stat-lbl">Listos hoy</div>
      </div>
    </div>
    <div class="last-update" id="last-update">—</div>
  </div>

  <!-- ===== COLUMNAS ===== -->
  <div class="columnas" id="columnas">
    <div class="loading-screen" style="grid-column: 1 / -1;">
      <div class="big-spinner"></div>
      <p>Cargando pedidos...</p>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <!-- Scripts — orden obligatorio -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>

  <script>
    // ── PROTECCIÓN DE RUTA ──────────────────────────────────────
    // Solo usuarios con rol "cocina" pueden acceder
    requireAuth(ROLES.COCINA);

    const usuario = getUser();
    if (usuario) {
      document.getElementById("topbar-nombre").textContent = usuario.nombre;
    }

    // ── ESTADO ──────────────────────────────────────────────────
    let pedidos        = { pendiente: [], confirmado: [], en_preparacion: [], listo: [] };
    let pollingTimer   = null;
    let primeraVez     = true;
    let enCambioEstado = new Set(); // IDs de pedidos con acción en progreso

    // ── ARRANCAR POLLING ─────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
      cargarPedidos();
      conectarTiempoReal();
      pollingTimer = setInterval(cargarPedidos, POLLING_INTERVAL);
    });

    // Pausar polling si la pestaña queda en segundo plano
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        clearInterval(pollingTimer);
        document.getElementById("polling-dot").classList.add("paused");
        document.getElementById("polling-label").textContent = "En pausa";
      } else {
        cargarPedidos();
        pollingTimer = setInterval(cargarPedidos, POLLING_INTERVAL);
        document.getElementById("polling-dot").classList.remove("paused");
      }
    });

    // ── CARGAR PEDIDOS ───────────────────────────────────────────
    async function cargarPedidos() {
      try {
        // GET /pedidos — devuelve todos los pedidos activos
        // El backend filtra por estado si se pasa ?estado=pendiente
        // Traemos todos para mostrar las columnas de cocina
        const lista = await fetchAPI("/pedidos");
        const base  = Array.isArray(lista) ? lista : [];

        // GET /pedidos/{id} para cada pedido — trae el detalle de productos
        const conDetalle = await Promise.all(
          base.map(p =>
            fetchAPI(`/pedidos/${p.id_pedido}`).catch(() => p)
          )
        );

        // Separar por estado
        pedidos.pendiente      = conDetalle.filter(p => p.estado === "pendiente");
        pedidos.confirmado     = conDetalle.filter(p => p.estado === "confirmado");
        pedidos.en_preparacion = conDetalle.filter(p => p.estado === "en_preparacion");
        pedidos.listo          = conDetalle.filter(p => p.estado === "listo");

        actualizarStats();
        renderColumnas();

        // Actualizar indicador de polling
        const ahora = new Date();
        document.getElementById("last-update").textContent =
          `Última actualización: ${ahora.toLocaleTimeString("es-AR")}`;
        document.getElementById("polling-label").textContent = "En vivo";

        primeraVez = false;

      } catch (error) {
        document.getElementById("polling-label").textContent = "Error";
        if (primeraVez) {
          document.getElementById("columnas").innerHTML = `
            <div class="loading-screen" style="grid-column:1/-1;">
              <p style="color:#ef4444;">⚠ No se pudo cargar los pedidos: ${escapeHtml(error.message)}</p>
            </div>`;
        }
      }
    }

    // ── STATS ────────────────────────────────────────────────────
    function actualizarStats() {
      document.getElementById("count-pendiente").textContent   = pedidos.pendiente.length;
      document.getElementById("count-confirmado").textContent  = pedidos.confirmado.length;
      document.getElementById("count-preparacion").textContent = pedidos.en_preparacion.length;
      document.getElementById("count-listo").textContent       = pedidos.listo.length;
    }

    // ── RENDER DE COLUMNAS ───────────────────────────────────────
    function renderColumnas() {
      document.getElementById("columnas").innerHTML = `
        ${renderColumna("pendiente",      "amarillo", "⏳ Pendientes",      pedidos.pendiente)}
        ${renderColumna("confirmado",     "rojo",     "✅ Confirmados",     pedidos.confirmado)}
        ${renderColumna("en_preparacion", "naranja",  "🔥 En preparación",  pedidos.en_preparacion)}
        ${renderColumna("listo",          "verde",    "✅ Listos",           pedidos.listo)}
      `;
    }

    function renderColumna(estado, color, titulo, lista) {
      const cards = lista.length === 0
        ? `<div class="columna-empty">
             <div class="icon">
               ${estado === "pendiente" ? "🕐" : estado === "confirmado" ? "📋" : estado === "en_preparacion" ? "👨‍🍳" : "🎉"}
             </div>
             <p>${estado === "pendiente" ? "Sin pedidos nuevos" : estado === "confirmado" ? "Sin pedidos confirmados" : estado === "en_preparacion" ? "Nada en preparación" : "Aún no hay pedidos listos"}</p>
           </div>`
        : lista.map(p => renderPedidoCard(p, estado, color)).join("");

      return `
        <div class="columna">
          <div class="columna-header">
            <div class="columna-titulo ${color}">${titulo}</div>
            <div class="columna-count ${color}">${lista.length}</div>
          </div>
          ${cards}
        </div>`;
    }

    // ── RENDER DE CADA CARD DE PEDIDO ────────────────────────────
    function renderPedidoCard(pedido, estado, color) {
      const hora      = pedido.fecha ? formatHora(pedido.fecha) : "—";
      const tiempo    = pedido.fecha ? calcularTiempo(pedido.fecha) : null;
      const productos = pedido.detalle || [];
      const total     = pedido.total || calcularTotal(productos);

      // Clase de urgencia según tiempo transcurrido
      let tiempoClass = "ok";
      let tiempoLabel = "";
      if (tiempo !== null) {
        if (tiempo > 20)       { tiempoClass = "urgente"; tiempoLabel = `⚠ ${tiempo}m`; }
        else if (tiempo > 10)  { tiempoClass = "normal";  tiempoLabel = `${tiempo}m`; }
        else                   { tiempoClass = "ok";      tiempoLabel = `${tiempo}m`; }
      }

      // Botones según estado
      let acciones = "";
      if (estado === "pendiente") {
        acciones = `
          <button class="btn-accion btn-preparar"
                  id="btn-${pedido.id_pedido}"
                  onclick="cambiarEstado(${pedido.id_pedido}, 'confirmado')">
            ✅ Confirmar
          </button>`;
      } else if (estado === "confirmado") {
        acciones = `
          <button class="btn-accion btn-preparar"
                  id="btn-${pedido.id_pedido}"
                  onclick="cambiarEstado(${pedido.id_pedido}, 'en_preparacion')">
             En preparación
          </button>`;
      } else if (estado === "en_preparacion") {
        acciones = `
          <button class="btn-accion btn-listo"
                  id="btn-${pedido.id_pedido}"
                  onclick="cambiarEstado(${pedido.id_pedido}, 'listo')">
             Marcar listo
          </button>`;
      } else if (estado === "listo") {
        acciones = `
          <button class="btn-accion btn-entregar"
                  id="btn-${pedido.id_pedido}"
                  onclick="cambiarEstado(${pedido.id_pedido}, 'entregado')">
            🧾 Entregado
          </button>`;
      }

      return `
        <div class="pedido-card ${color}" id="card-${pedido.id_pedido}">

          <div class="pedido-header">
            <div>
              <div class="pedido-mesa"> Mesa ${pedido.id_mesa || "—"}</div>
              <div class="pedido-id">#${pedido.id_pedido}</div>
            </div>
            <div class="pedido-hora">
              ${hora}
              ${tiempoLabel ? `<div class="pedido-tiempo ${tiempoClass}">${tiempoLabel}</div>` : ""}
            </div>
          </div>

          <div class="pedido-items">
            ${productos.length > 0
              ? productos.map(item => `
                  <div class="pedido-item">
                    <span class="pedido-item-nombre">
                      ${escapeHtml(item.nombre || item.producto_nombre || "Producto")}
                    </span>
                    <span class="pedido-item-cantidad ${color}">×${item.cantidad}</span>
                  </div>`).join("")
              : `<div class="pedido-item" style="color:var(--text-dim); font-size:0.8rem;">
                   Sin detalle disponible
                 </div>`
            }
          </div>

          ${pedido.observaciones ? `
            <div class="pedido-observaciones">
              <strong>Observaciones</strong>
              ${escapeHtml(pedido.observaciones)}
            </div>` : ""}

          ${total > 0 ? `
            <div class="pedido-total">
              <span>Total del pedido</span>
              <span class="pedido-total-val">${formatPrecio(total)}</span>
            </div>` : ""}

          ${acciones ? `<div class="pedido-actions">${acciones}</div>` : ""}

        </div>`;
    }

    // ── CAMBIAR ESTADO ────────────────────────────────────────────
    async function cambiarEstado(idPedido, nuevoEstado) {
      if (enCambioEstado.has(idPedido)) return;
      enCambioEstado.add(idPedido);

      const btn = document.getElementById(`btn-${idPedido}`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';
      }

      try {
        // PATCH /pedidos/{id}/estado — requiere token de cocina
        // Body: { estado: "en_preparacion" | "listo" }
        await fetchAPI(`/pedidos/${idPedido}/estado`, "PATCH", { estado: nuevoEstado });

        const labels = {
          en_preparacion: "🔥 Pedido en preparación",
          listo:          "✅ Pedido marcado como listo",
          confirmado:     "✅ Pedido confirmado",
          entregado:      "🧾 Pedido entregado",
        };
        mostrarToast(labels[nuevoEstado] || "Estado actualizado", "success");

        // Recargar inmediatamente sin esperar el polling
        await cargarPedidos();

      } catch (error) {
        mostrarToast("Error al cambiar estado: " + error.message, "error");
        if (btn) {
          btn.disabled = false;
          const textos = {
            confirmado: "✅ Confirmar",
            en_preparacion: "🔥 En preparación",
            listo: "✅ Marcar listo",
            entregado: "🧾 Entregado",
          };
          btn.innerHTML = textos[nuevoEstado] || "Actualizar";
        }
      } finally {
        enCambioEstado.delete(idPedido);
      }
    }

    // ── TIEMPO REAL ──────────────────────────────────────────────
    function conectarTiempoReal() {
      const token = getToken();
      if (!token) return;

      const wsProtocol = API_URL.startsWith("https") ? "wss" : "ws";
      const wsBase = API_URL.replace(/^https?:\/\//, "");
      const socket = new WebSocket(`${wsProtocol}://${wsBase}/pedidos/ws/cocina?token=${encodeURIComponent(token)}`);

      socket.addEventListener("message", () => {
        reproducirAviso();
        cargarPedidos();
      });

      socket.addEventListener("close", () => {
        setTimeout(conectarTiempoReal, 4000);
      });
    }

    function reproducirAviso() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = 880;
        gain.gain.value = 0.04;
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.16);
      } catch {
        // El navegador puede bloquear audio si no hubo interacción previa.
      }
    }

    // ── HELPERS ──────────────────────────────────────────────────
    function formatHora(fechaStr) {
      try {
        const d = new Date(fechaStr);
        return d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
      } catch { return "—"; }
    }

    function calcularTiempo(fechaStr) {
      try {
        const diff = Date.now() - new Date(fechaStr).getTime();
        return Math.floor(diff / 60000); // minutos
      } catch { return null; }
    }

    function calcularTotal(productos) {
      return productos.reduce((acc, p) =>
        acc + ((p.precio || p.subtotal || 0) * (p.cantidad || 1)), 0);
    }

    const formatterPrecio = new Intl.NumberFormat("es-AR", {
      style: "currency",
      currency: "ARS",
      maximumFractionDigits: 0,
    });

    function formatPrecio(valor) {
      return formatterPrecio.format(Number(valor) || 0);
    }

    let toastTimer;
    function mostrarToast(mensaje, tipo = "success") {
      const toast = document.getElementById("toast");
      toast.textContent = mensaje;
      toast.className   = `toast ${tipo} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
