<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanOrder — Cocina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/pedidos.css" />
</head>

<body>

  <!-- ===== TOPBAR ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">Maven<span>Burger</span></div>
      <div class="cocina-badge">Cocina</div>
    </div>
    <div class="topbar-right">
      <div class="polling-indicator">
        <div class="polling-dot" id="polling-dot"></div>
        <span id="polling-label">Actualizando...</span>
      </div>
      <div class="topbar-user">
        Hola, <strong id="topbar-nombre">—</strong>
      </div>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
  </header>

  <!-- ===== STATS BAR ===== -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-dot amarillo"></div>
      <div class="stat-info">
        <div class="stat-num amarillo" id="count-total">0</div>
        <div class="stat-lbl">Pedidos activos</div>
      </div>
    </div>
    <div class="last-update" id="last-update">—</div>
  </div>

  <!-- ===== COLUMNAS ===== -->
  <div class="columnas" id="columnas">
    <div class="loading-screen" style="grid-column: 1 / -1;">
      <div class="big-spinner"></div>
      <p>Cargando pedidos...</p>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <!-- Scripts — orden obligatorio -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    // Token de dispositivo fijo para este panel de cocina.
    // Debe coincidir con COCINA_DEVICE_TOKEN en backend/.env
    // IMPORTANTE: debe ir ANTES de pedidos.js, que lo lee al cargarse.
    window.COCINA_DEVICE_TOKEN = "C7vRnMUAG_hKwRUTGGSyDf2TGTOBb_NFkuxgv1iwBP0";
  </script>
    <script src="js/pedidos.js"></script>
</body>
</html>
