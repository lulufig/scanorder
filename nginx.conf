server {
    listen 80;
    server_name _;

    root /srv/scanorder;
    index /frontend/login.html;

    # Redirigir raíz al login
    location = / {
        return 302 /frontend/login.html;
    }

    # Servir archivos estáticos del frontend
    location /frontend/ {
        try_files $uri $uri/ =404;
    }

    # Bloquear acceso al código fuente del backend y docs
    location /backend/ {
        return 403;
    }
    location /docs/ {
        return 403;
    }
    location ~ /\. {
        return 403;
    }
}
